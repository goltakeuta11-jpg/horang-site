<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png?v=20260831.190">

<link rel="stylesheet" href="assets/style.css?v=20260831.190">
<style>
  .sl-kakao { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 800;
    background: #FEE500; color: #3C1E1E; text-decoration: none; padding: 13px 18px; border-radius: 14px; margin: 0 0 18px;
    box-shadow: 0 2px 10px rgba(254,229,0,.25); }
  .sl-kakao:hover { filter: brightness(.96); }
  .sl-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 16px; margin: 0 0 18px; }
  .sl-sec-title { font-size: 15px; font-weight: 800; margin: 0 0 12px; }
  .sl-chartwrap { position: relative; width: 100%; }
  .sl-legend { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0 0; font-size: 12.5px; }
  .sl-legend span { display: inline-flex; align-items: center; gap: 5px; color: var(--text-dim); }
  .sl-legend i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
  .sl-empty { color: var(--text-dim); text-align: center; padding: 28px 10px; font-size: 14px; }
  .sl-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
  .sl-form .field { flex: 1; min-width: 120px; }
  .sl-row { display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 7px 10px; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .sl-row .d { color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .sl-row b { color: var(--accent); }
  .sl-muted { color: var(--text-dim); font-size: 13px; }
  .sl-weeknav { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; }
  .sl-weeklabel { font-size: 13px; font-weight: 700; color: var(--text-dim); white-space: nowrap; }
  .sl-weeksel { flex: 1; max-width: 240px; font-variant-numeric: tabular-nums; }
  .sl-total-title { font-size: 12.5px; font-weight: 700; color: var(--text-dim); margin: 14px 0 6px; }
  .sl-total { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; }
  .sl-pill { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 6px 11px; font-size: 12.5px; }
  .sl-pill b { color: var(--text); }
</style>
</head>
<body>

<header class="header"><div class="header__inner" data-header></div></header>

<main class="wrap page">
  <h1 class="page__title">학습관리 📊</h1>
  <p class="page__desc">함께 공부한 기록을 그래프로 모아봐요. (날짜별 공부 시간, 단위: 분)</p>

  <a class="sl-kakao" href="https://open.kakao.com/o/gWHFnJSi" target="_blank" rel="noopener">💬 공부 오픈채팅 참여하기</a>

  <!-- 그래프 -->
  <div class="sl-card">
    <div class="sl-sec-title">📈 공부 시간 그래프 <span class="sl-muted" style="font-weight:500">(분 · 주간)</span></div>
    <div class="sl-weeknav">
      <span class="sl-weeklabel">주 선택</span>
      <select class="input sl-weeksel" data-weeksel></select>
    </div>
    <div class="sl-chartwrap"><canvas data-chart></canvas></div>
    <div class="sl-legend" data-legend></div>
    <div class="sl-total-title" data-total-title></div>
    <div class="sl-total" data-total></div>
  </div>

  <!-- 관리자 입력 -->
  <section data-admin hidden></section>

  <!-- 기록 목록 -->
  <div class="sl-card">
    <div class="sl-sec-title">📋 기록</div>
    <input class="input sl-search" data-search placeholder="🔎 이름으로 검색 (비우면 전체)" style="margin:0 0 12px">
    <div data-list><p class="sl-muted">불러오는 중…</p></div>
  </div>
</main>

<script src="assets/config.js?v=20260831.190"></script>
<script src="assets/store.js?v=20260831.190"></script>
<script src="assets/app.js?v=20260831.190"></script>
<script>
App.header("study.html");

const $ = s => document.querySelector(s);
const esc = s => App.esc(String(s == null ? "" : s));
const COLORS = ["#FF5C7A", "#5B9BD5", "#3FBF6F", "#E0920A", "#9B86F0", "#FF8A3D", "#2CC5C5", "#D45BBE", "#8FBF3F", "#6C7BF0"];
let LOGS = [];
let LISTQ = "";   // 기록 이름 검색어

async function api(payload) {
  const r = await fetch("/api/gs", { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
  return r.json();
}

/* ---------- 주(일~토) 유틸 ---------- */
const WDAY = ["일", "월", "화", "수", "목", "금", "토"];
function kstNow() { return new Date(Date.now() + 9 * 3600000); }            // getUTC* = KST 벽시계
function ymd(dt) { return dt.getUTCFullYear() + "-" + String(dt.getUTCMonth() + 1).padStart(2, "0") + "-" + String(dt.getUTCDate()).padStart(2, "0"); }
function parseYmd(s) { const p = String(s).split("-").map(Number); return new Date(Date.UTC(p[0], (p[1] || 1) - 1, p[2] || 1)); }
function addDays(dt, n) { const x = new Date(dt.getTime()); x.setUTCDate(x.getUTCDate() + n); return x; }
function weekdayOf(s) { return parseYmd(s).getUTCDay(); }                    // 0=일
let WEEK_START = (function () { const t = kstNow(); return ymd(addDays(t, -t.getUTCDay())); })();  // 이번 주 일요일
function weekDates() { const s = parseYmd(WEEK_START); const out = []; for (let i = 0; i < 7; i++) out.push(ymd(addDays(s, i))); return out; }

/* 선택한 주로 집계: dates=그 주 7일(일~토 고정), people=그 주 데이터만 */
function weekBuild() {
  const dates = weekDates();
  const dset = {}; dates.forEach(d => dset[d] = 1);
  const people = {};
  LOGS.forEach(r => {
    const n = String(r.name || "").trim(); const d = String(r.date || "").trim(); const m = Number(r.minutes) || 0;
    if (!n || !(d in dset)) return;
    people[n] = people[n] || {};
    people[n][d] = (people[n][d] || 0) + m;
  });
  const names = Object.keys(people).sort();
  return { people, dates, names };
}
function drawChart() {
  const canvas = $("[data-chart]");
  const wrap = canvas.parentElement;
  const cssW = Math.max(260, wrap.clientWidth);
  const cssH = 300;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = cssW * dpr; canvas.height = cssH * dpr;
  canvas.style.width = cssW + "px"; canvas.style.height = cssH + "px";
  const ctx = canvas.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssW, cssH);

  const cs = getComputedStyle(document.body);
  const colText = (cs.getPropertyValue("--text-dim") || "#888").trim() || "#888";
  const colLine = (cs.getPropertyValue("--line") || "#333").trim() || "#333";

  const { people, dates, names } = weekBuild();   // 선택한 주 7일(일~토) 고정
  const padL = 38, padR = 12, padT = 14, padB = 40;
  const plotW = cssW - padL - padR, plotH = cssH - padT - padB;
  let maxY = 0;
  names.forEach(n => dates.forEach(d => { if ((people[n][d] || 0) > maxY) maxY = people[n][d]; }));
  maxY = Math.max(1, Math.ceil(maxY));
  const groupW = plotW / dates.length;          // 날짜 한 칸 폭
  const xAt = i => padL + groupW * (i + 0.5);    // 그룹(날짜) 중심 x
  const yAt = v => padT + plotH - plotH * (v / maxY);

  // y 그리드 + 라벨
  ctx.strokeStyle = colLine; ctx.fillStyle = colText; ctx.font = "11px sans-serif"; ctx.lineWidth = 1;
  const steps = 4;
  for (let s = 0; s <= steps; s++) {
    const v = maxY * s / steps, y = yAt(v);
    ctx.globalAlpha = 0.5; ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(cssW - padR, y); ctx.stroke(); ctx.globalAlpha = 1;
    ctx.textAlign = "right"; ctx.textBaseline = "middle"; ctx.fillText(String(Math.round(v)), padL - 6, y);
  }
  // x 라벨 (7일: 일자 + 요일)
  ctx.textAlign = "center"; ctx.textBaseline = "top";
  dates.forEach((d, i) => {
    const wd = weekdayOf(d);
    ctx.fillStyle = (wd === 0) ? "#FF5C7A" : (wd === 6 ? "#5B9BD5" : colText);
    ctx.fillText(String(parseYmd(d).getUTCDate()), xAt(i), cssH - padB + 7);
    ctx.fillText("(" + WDAY[wd] + ")", xAt(i), cssH - padB + 20);
  });
  ctx.fillStyle = colText;
  if (!names.length) {
    ctx.font = "14px sans-serif"; ctx.textAlign = "center";
    ctx.fillText("이 주에는 기록이 없어요.", cssW / 2, padT + plotH / 2);
    $("[data-legend]").innerHTML = ""; return;
  }

  // 날짜별 막대 (한 날짜 안에 공부한 사람들을 나란히, 사람별 색)
  const baseY = padT + plotH;
  dates.forEach((d, i) => {
    const ppl = names.filter(n => d in people[n]);
    if (!ppl.length) return;
    const bw = Math.min(26, (groupW * 0.72) / ppl.length);
    let x = xAt(i) - (bw * ppl.length) / 2;
    ppl.forEach(n => {
      const y = yAt(people[n][d]);
      ctx.fillStyle = COLORS[names.indexOf(n) % COLORS.length];
      ctx.fillRect(x + 1, y, Math.max(2, bw - 2), baseY - y);
      x += bw;
    });
  });

  // 범례
  $("[data-legend]").innerHTML = names.map((n, ni) =>
    `<span><i style="background:${COLORS[ni % COLORS.length]}"></i>${esc(n)}</span>`).join("");
}

/* ---------- 분 → "N시간 N분" ---------- */
function fmtMin(m) {
  m = Math.round(Number(m) || 0);
  const h = Math.floor(m / 60), mm = m % 60;
  if (h > 0 && mm > 0) return h + "시간 " + mm + "분";
  if (h > 0) return h + "시간";
  return mm + "분";
}
function weekLabel(startStr) {
  const s = parseYmd(startStr), e = addDays(s, 6);
  return ymd(s).slice(5).replace("-", "/") + " ~ " + ymd(e).slice(5).replace("-", "/");
}
function weekStartOf(dateStr) { const d = parseYmd(dateStr); return ymd(addDays(d, -d.getUTCDay())); }

/* ---------- 주 선택 드롭다운 ---------- */
function allWeekStarts() {
  const set = {};
  const t = kstNow(); const cur = ymd(addDays(t, -t.getUTCDay()));
  set[cur] = 1;
  LOGS.forEach(r => { if (r && r.date) set[weekStartOf(r.date)] = 1; });
  const arr = Object.keys(set).sort();
  const min = parseYmd(arr[0]), max = parseYmd(arr[arr.length - 1]);   // 최소~최대 주를 연속 생성
  const out = [];
  for (let d = new Date(min.getTime()); d.getTime() <= max.getTime(); d = addDays(d, 7)) out.push(ymd(d));
  return out.reverse();   // 최근 주가 위
}
function renderWeekNav() {
  const sel = $("[data-weeksel]");
  const starts = allWeekStarts();
  if (starts.indexOf(WEEK_START) < 0) WEEK_START = starts[0];   // 안전장치
  const t = kstNow(); const cur = ymd(addDays(t, -t.getUTCDay()));
  sel.innerHTML = starts.map(s => `<option value="${s}"${s === WEEK_START ? " selected" : ""}>${weekLabel(s)}${s === cur ? " (이번 주)" : ""}</option>`).join("");
  sel.onchange = () => { WEEK_START = sel.value; refresh(); };
}
function renderTotals() {
  const { people, names } = weekBuild();
  const el = $("[data-total]"), title = $("[data-total-title]");
  if (!names.length) { el.innerHTML = ""; title.textContent = ""; return; }
  title.textContent = "🗓 이 주 합계 (" + weekLabel(WEEK_START) + ")";
  const totals = names.map(n => ({ n, m: Object.values(people[n]).reduce((s, v) => s + v, 0) }))
    .sort((a, b) => b.m - a.m);
  el.innerHTML = totals.map(t => `<span class="sl-pill">${esc(t.n)} <b>${fmtMin(t.m)}</b></span>`).join("");
}

/* ---------- 기록 목록 ---------- */
function renderList() {
  const admin = App.isAdmin();
  const el = $("[data-list]");
  if (!LOGS.length) { el.innerHTML = `<p class="sl-muted">아직 기록이 없어요.${admin ? " 아래에서 추가해보세요!" : ""}</p>`; return; }
  const q = (LISTQ || "").trim().toLowerCase();
  let rows = LOGS.slice();
  if (q) rows = rows.filter(r => String(r.name || "").toLowerCase().indexOf(q) >= 0);   // 이름 검색(부분일치)
  if (!rows.length) { el.innerHTML = `<p class="sl-muted">"${esc(LISTQ)}" 이름의 기록이 없어요.</p>`; return; }
  const sorted = rows.sort((a, b) => String(b.date).localeCompare(String(a.date)) || String(b.at).localeCompare(String(a.at)));
  el.innerHTML = sorted.map(r => `
    <div class="sl-row" data-id="${esc(r.id)}">
      <span><b>${esc(r.name)}</b> · <span class="d">${esc(r.date)}</span></span>
      <span style="display:flex;align-items:center;gap:10px">
        <span>${fmtMin(r.minutes)}</span>
        ${admin ? `<button class="btn btn--danger btn--sm" data-del>삭제</button>` : ""}
      </span>
    </div>`).join("");
  if (admin) el.querySelectorAll("[data-del]").forEach(btn => btn.onclick = async () => {
    const row = btn.closest("[data-id]"); const id = row.dataset.id;
    if (btn.dataset.confirm !== "1") { btn.dataset.confirm = "1"; btn.textContent = "정말?"; setTimeout(() => { btn.dataset.confirm = "0"; btn.textContent = "삭제"; }, 2500); return; }
    btn.disabled = true;
    const r = await api({ studyAction: "delete", key: App.key(), id });
    if (r.ok) { LOGS = r.logs || []; refresh(); App.toast("삭제됐어요."); } else { App.toast(r.error || "삭제 실패", true); btn.disabled = false; }
  });
}

/* ---------- 관리자 입력 ---------- */
function renderAdmin() {
  if (!App.isAdmin()) return;
  const el = $("[data-admin]");
  el.hidden = false;
  const today = new Date(Date.now() + 9 * 3600000).toISOString().slice(0, 10);
  el.innerHTML = `
    <div class="sl-card">
      <div class="sl-sec-title">🛠 기록 추가 (관리자)</div>
      <div class="sl-form">
        <label class="field"><span class="field__label">이름</span><input class="input" data-name placeholder="이름"></label>
        <label class="field"><span class="field__label">날짜</span><input class="input" type="date" data-date value="${today}"></label>
        <label class="field"><span class="field__label">공부 시간(분)</span><input class="input" type="number" data-mins step="1" min="0" placeholder="예: 90"></label>
        <button class="btn btn--primary" data-add>추가</button>
      </div>
      <p class="sl-muted" style="margin:10px 0 0">공부 시간은 <b>분 단위</b>로 입력해요 (예: 90 = 1시간 30분). 추가하면 바로 그래프에 반영돼요.</p>
    </div>`;
  el.querySelector("[data-add]").onclick = doAdd;
}
async function doAdd() {
  const name = ($("[data-name]").value || "").trim();
  const date = ($("[data-date]").value || "").trim();
  const minutes = parseInt($("[data-mins]").value, 10);
  if (!name) return App.toast("이름을 입력해주세요.", true);
  if (!date) return App.toast("날짜를 선택해주세요.", true);
  if (!(minutes > 0)) return App.toast("공부 시간(분)을 입력해주세요.", true);
  const btn = $("[data-add]"); btn.disabled = true; btn.textContent = "추가 중…";
  try {
    const r = await api({ studyAction: "add", key: App.key(), name, date, minutes });
    if (r.ok) { LOGS = r.logs || []; refresh(); $("[data-name]").value = ""; $("[data-mins]").value = ""; App.toast("기록이 추가됐어요!"); }
    else App.toast(r.error || "추가 실패", true);
  } catch (e) { App.toast("네트워크 오류예요.", true); }
  finally { btn.disabled = false; btn.textContent = "추가"; }
}

/* ---------- 렌더 ---------- */
function refresh() { renderWeekNav(); drawChart(); renderTotals(); renderList(); }
window.addEventListener("resize", drawChart);
$("[data-search]").addEventListener("input", (e) => { LISTQ = e.target.value; renderList(); });

(async function () {
  renderAdmin();
  try { const r = await api({ studyAction: "list" }); if (r.ok) LOGS = r.logs || []; } catch (e) {}
  refresh();
})();
</script>
</body>
</html>
