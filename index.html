<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png?v=20260831.101">
<link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png?v=20260831.101">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=20260831.101">
<meta property="og:type" content="website">
<meta property="og:title" content="호랑봇 허브">
<meta property="og:description" content="봇 명령어 · 자소서 · 외출 · 패치노트를 한 곳에서.">
<meta property="og:url" content="https://horangbot.co.kr/">
<meta property="og:image" content="https://horangbot.co.kr/assets/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="theme-color" content="#12141B">
<script src="assets/inapp.js?v=20260831.101"></script>
<title>호랑봇 허브</title>
<link rel="stylesheet" href="assets/style.css?v=20260831.101">
</head>
<body>

<header class="header"><div class="header__inner" data-header></div></header>

<main class="wrap">
  <section class="hero">
    <h1 class="hero__title">우리 방에 필요한 건<br><em>여기</em> 다 있어요.</h1>
    <p class="hero__desc">
      자소서 · 작대기 · 봇 명령어 · 심리테스트 · 외출 · 패치노트까지,
      우리 방에서 쓰는 기능을 한 곳에 모았어요.
    </p>
  </section>

  <!-- 최근 패치노트 -->
  <section style="margin-top:32px" data-patch-home></section>

  <section style="margin-top:40px" data-admin-box></section>

  <section class="note" style="margin-top:30px">
    수정은 관리자만 할 수 있습니다. 잘못된 내용이 있으면 방에서 운영자에게 알려주세요.
  </section>
</main>

<script src="assets/config.js?v=20260831.101"></script>
<script src="assets/store.js?v=20260831.101"></script>
<script src="assets/app.js?v=20260831.101"></script>
<script>
  document.title = CONFIG.ROOM_NAME + " 허브";
  App.header("index.html");

  /* ---------- 홈 최근 패치노트 ---------- */
  function pretty(d) {
    const m = (d || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
    return m ? `${m[1]}. ${+m[2]}. ${+m[3]}` : d;
  }
  const CAT_CLASS = { "신규 기능 추가": "cat--new", "오류 수정": "cat--fix", "기존 기능 수정": "cat--mod", "기존 기능 삭제": "cat--del" };

  function renderPatchHome() {
    const box = document.querySelector("[data-patch-home]");
    const recent = (Store.get().patchnotes || []).slice(-3).reverse();  // 업로드 최신순 상위 3개

    let inner = `<div class="toolbar" style="margin:0 0 14px">
        <h2 style="font-size:18px;font-weight:800;margin:0">📰 최근 패치노트</h2>
        <span class="toolbar__spacer"></span>
        <a class="btn btn--sm" href="${App.link("patchnotes.html")}">전체 보기 →</a>
      </div>`;

    if (!recent.length) {
      inner += `<div class="empty" style="padding:34px 20px">
        <strong>아직 패치노트가 없습니다</strong>바뀐 내용이 생기면 여기에 올라옵니다.</div>`;
    } else {
      inner += `<div class="card" style="padding:6px 10px"><div class="patches">` +
        recent.map(n => `
          <article class="patch">
            <div class="patch__when">
              <span class="patch__date">${App.esc(pretty(n.date))}</span>
              ${n.ver ? `<span class="patch__ver">v${App.esc(n.ver)}</span>` : ""}
            </div>
            <div class="patch__main">
              <span class="patch__cat ${CAT_CLASS[n.cat] || "cat--new"}">${App.esc(n.cat)}</span>
              <p class="patch__body" style="margin:0">${App.esc(n.body)}</p>
            </div>
            <span></span>
          </article>`).join("") +
        `</div></div>`;
    }
    box.innerHTML = inner;
  }

  Store.load().then(renderPatchHome).catch(() => renderPatchHome());

  /* ---------- 관리자 박스 ---------- */
  const box = document.querySelector("[data-admin-box]");
  if (App.isAdmin()) {
    box.innerHTML = `
      <div class="card">
        <h2 style="font-size:17px;margin-bottom:8px">관리자로 보고 있습니다</h2>
        <p style="color:var(--text-dim);font-size:14px;margin:0 0 16px" data-mode></p>
        <div class="field">
          <label class="field__label">일반 공유 주소</label>
          <input class="input" readonly data-share>
        </div>
        <div class="toolbar" style="margin:0">
          <button class="btn btn--primary" data-export>📤 데이터 내보내기 (시트 편집 시작)</button>
          <button class="btn btn--primary" data-import-sheet>📥 데이터 가져오기 (편집 완료·반영)</button>
          <button class="btn" data-copy>주소 복사</button>
          <button class="btn" onclick="Store.export()" title="JSON 파일로 백업 다운로드">JSON 백업</button>
        </div>
        <div style="color:var(--text-dim);font-size:12.5px;margin:12px 0 0;line-height:1.7">
          💡 <b>편집 방법</b>: ①<b>내보내기</b>를 누르면 모든 데이터가 구글 시트로 나가고 <b>편집 잠금</b>이 걸려요(그동안 사용자 편집 차단).
          ②시트(Bot-Web)에서 수정·삭제한 뒤 ③<b>가져오기</b>를 누르면 사이트에 반영되고 잠금이 풀려요.
          <span data-lockline></span>
        </div>
      </div>
      <div class="card" style="margin-top:16px" data-viewstats>
        <h2 style="font-size:17px;margin-bottom:4px">📊 탭별 하루 평균 조회</h2>
        <p style="color:var(--text-dim);font-size:13px;margin:0 0 12px">한 방문당 1회로 셉니다. (봇·크롤러 제외)</p>
        <div data-views>불러오는 중…</div>
      </div>`;

    const sheetLink = '<a href="' + Store.sheetEditUrl() + '" target="_blank" rel="noopener" style="color:var(--accent-2)">시트 열기</a>';
    const modeText = {
      script: "각 화면에서 추가 · 수정 · 삭제하면 구글 시트에 자동으로 저장됩니다. " + sheetLink,
      sheet: "내용은 구글 시트에서 관리합니다. 시트를 고치면 이 사이트에 바로 반영됩니다. " + sheetLink,
      local: "각 화면에 추가 · 수정 · 삭제 버튼이 보입니다. 다만 지금은 이 브라우저에만 저장되니, 다른 사람에게 보여주려면 시트를 연결하세요."
    };
    box.querySelector("[data-mode]").innerHTML = modeText[Store.MODE];

    const share = location.href.split("?")[0];
    box.querySelector("[data-share]").value = share;
    box.querySelector("[data-copy]").onclick = async () => {
      try { await navigator.clipboard.writeText(share); App.toast("주소를 복사했습니다."); }
      catch (e) { App.toast("복사가 막혀 있습니다. 주소를 직접 선택해 주세요.", true); }
    };

    /* ---------- 탭별 하루 평균 조회 ---------- */
    (async function renderViews() {
      const el = box.querySelector("[data-views]");
      const url = (window.CONFIG && CONFIG.SCRIPT_URL || "").trim();
      if (!url) { el.textContent = "시트 연결(SCRIPT_URL)이 없어 통계를 볼 수 없습니다."; return; }
      let views;
      try {
        const r = await fetch(url + "?action=viewstats&_=" + Date.now(), { redirect: "follow" });
        const j = await r.json();
        if (!j || !j.ok) throw 0;
        views = j.views || [];
      } catch (e) { el.textContent = "조회통계를 불러오지 못했습니다. (재배포 필요할 수 있어요)"; return; }
      if (!views.length) { el.innerHTML = "<div class='empty' style='padding:20px'><strong>아직 조회 기록이 없습니다</strong>사람들이 페이지를 열면 여기에 쌓입니다.</div>"; return; }
      const byPage = {}, dayset = {}, monthDays = {};
      views.forEach(v => {
        byPage[v.page] = (byPage[v.page] || 0) + v.count;
        if (String(v.date).length === 7) monthDays[v.date] = Math.max(monthDays[v.date] || 0, v.days || 0); // 월요약(YYYY-MM): 달당 1번 일수
        else dayset[v.date] = 1;                                                                            // 일별(YYYY-MM-DD): 날짜 1개
      });
      const days = (Object.keys(dayset).length + Object.values(monthDays).reduce((s, d) => s + d, 0)) || 1;
      const rows = Object.keys(byPage).map(p => ({ p, total: byPage[p], avg: byPage[p] / days }))
        .sort((a, b) => b.avg - a.avg);
      el.innerHTML =
        "<div class='rows'>" +
        rows.map(x => `<div class="row"><span class="row__k" style="min-width:110px">${App.esc(x.p)}</span>` +
          `<span class="row__v"><b>${x.avg.toFixed(1)}</b>회/일 <span style="color:var(--text-dim)">· 누적 ${x.total}</span></span></div>`).join("") +
        "</div>" +
        `<p style="color:var(--text-dim);font-size:12px;margin:12px 0 0">집계 기간 ${days}일 · 총 ${views.reduce((s, v) => s + v.count, 0)}회</p>`;
    })();
    /* ---------- 📤 내보내기 / 📥 가져오기 (서버 ↔ 시트) + 잠금 상태 ---------- */
    const url_ = (window.CONFIG && CONFIG.SCRIPT_URL || "").trim();
    const lockLine = box.querySelector("[data-lockline]");
    async function refreshLockLine() {
      try {
        const r = await fetch(url_ + "?action=lockstatus&_=" + Date.now());
        const j = await r.json();
        if (lockLine) lockLine.innerHTML = j.locked
          ? '<br><b style="color:var(--accent)">🔒 현재 편집 잠금 상태 (시트 편집 중) — 완료했으면 가져오기를 누르세요.</b>'
          : '<br><span style="color:#4caf7d">🔓 지금은 정상 상태예요.</span>';
      } catch (e) {}
    }
    refreshLockLine();

    const exportBtn = box.querySelector("[data-export]");
    if (exportBtn) exportBtn.onclick = async () => {
      if (!confirm("모든 데이터를 구글 시트로 내보내고 편집 잠금을 켤까요?\n(잠금 중엔 사용자 편집이 막혀요. 시트 수정 후 '가져오기'를 누르세요.)")) return;
      exportBtn.disabled = true; exportBtn.textContent = "내보내는 중…";
      try {
        const r = await fetch(url_, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ exportSheet: true, key: App.key() }) });
        const j = await r.json();
        if (!j || !j.ok) throw new Error((j && j.error) || "실패");
        App.toast("시트로 내보냈어요! 지금부터 편집 잠금 🔒 — 시트 수정 후 '가져오기'를 누르세요.");
        refreshLockLine();
      } catch (e) { App.toast("내보내기 실패: " + e.message, true); }
      finally { exportBtn.disabled = false; exportBtn.textContent = "📤 데이터 내보내기 (시트 편집 시작)"; }
    };

    const importBtn = box.querySelector("[data-import-sheet]");
    if (importBtn) importBtn.onclick = async () => {
      if (!confirm("구글 시트의 현재 내용으로 서버를 덮어쓰고 편집 잠금을 해제할까요?\n(시트에서 지운 항목은 사이트에서도 사라집니다.)")) return;
      importBtn.disabled = true; importBtn.textContent = "가져오는 중…";
      try {
        const r = await fetch(url_, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ importSheet: true, key: App.key() }) });
        const j = await r.json();
        if (!j || !j.ok) throw new Error((j && j.error) || "실패");
        const s = j.synced || {};
        const parts = Object.keys(s).map(k => k + " " + s[k]).join(" · ");
        try { Store.clearCache && Store.clearCache(); } catch (e) {}
        App.toast("시트 내용을 반영하고 잠금을 해제했어요! (" + (parts || "완료") + ")");
        setTimeout(() => location.reload(), 900);
      } catch (e) { App.toast("가져오기 실패: " + e.message, true); }
      finally { importBtn.disabled = false; importBtn.textContent = "📥 데이터 가져오기 (편집 완료·반영)"; }
    };
  } else {
    box.innerHTML = `
      <div class="card">
        <h2 style="font-size:17px;margin-bottom:8px">운영자이신가요?</h2>
        <p style="color:var(--text-dim);font-size:14px;margin:0 0 14px">
          관리자 비밀번호를 입력하면 수정 화면이 열립니다.
        </p>
        <div class="toolbar" style="margin:0">
          <input class="input" style="max-width:240px" type="password" placeholder="관리자 비밀번호" data-key>
          <button class="btn btn--primary" data-in>로그인</button>
        </div>
      </div>`;
    const input = box.querySelector("[data-key]");
    const btn = box.querySelector("[data-in]");
    const go = async () => {
      btn.disabled = true; btn.textContent = "확인 중…";
      const r = await App.signIn(input.value.trim());
      btn.disabled = false; btn.textContent = "로그인";
      if (r === "ok") location.reload();
      else if (r === "nostorage") App.toast("이 브라우저에서는 로그인 정보를 저장할 수 없어요.", true);
      else if (r === "neterr") App.toast("서버에 연결하지 못했어요. 잠시 후 다시 시도해주세요.", true);
      else App.toast("비밀번호가 맞지 않습니다.", true);
    };
    btn.onclick = go;
    input.onkeydown = e => { if (e.key === "Enter") go(); };
  }
</script>
</body>
</html>
