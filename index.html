<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta property="og:type" content="website">
<meta property="og:title" content="호랑봇 안내소">
<meta property="og:description" content="봇 명령어 · 자소서 · 외출 · 패치노트를 한 곳에서.">
<meta name="theme-color" content="#12141B">
<script src="assets/inapp.js?v=20260805.1"></script>
<title>호랑봇 안내소</title>
<link rel="stylesheet" href="assets/style.css?v=20260805.1">
</head>
<body>

<header class="header"><div class="header__inner" data-header></div></header>

<main class="wrap">
  <section class="hero">
    <h1 class="hero__title">방에서 궁금한 건<br><em>여기서</em> 다 찾습니다.</h1>
    <p class="hero__desc">
      봇 명령어, 멤버 소개, 그리고 무엇이 바뀌었는지까지.
      채팅 위로 올려가며 찾지 말고 이 페이지를 열어두세요.
    </p>
  </section>

  <!-- 최근 패치노트 — 명령어·멤버소개 타일 자리(맨 위 콘텐츠) -->
  <section style="margin-top:32px" data-patch-home></section>

  <section class="grid grid--3" style="margin-top:32px">
    <a class="tile" href="commands.html" data-tile="commands">
      <span class="tile__no">01</span>
      <h2 class="tile__title">명령어</h2>
      <p class="tile__desc">봇에게 뭐라고 쳐야 하는지, 무엇이 나오는지.</p>
    </a>
    <a class="tile" href="members.html?g=남자" data-tile="members-m">
      <span class="tile__no">02</span>
      <h2 class="tile__title">남자 자소서</h2>
      <p class="tile__desc">남자 멤버들 자기소개.</p>
    </a>
    <a class="tile" href="members.html?g=여자" data-tile="members-f">
      <span class="tile__no">03</span>
      <h2 class="tile__title">여자 자소서</h2>
      <p class="tile__desc">여자 멤버들 자기소개.</p>
    </a>
    <a class="tile" href="outings.html" data-tile="outings">
      <span class="tile__no">04</span>
      <h2 class="tile__title">외출</h2>
      <p class="tile__desc">방에서 외출한 사람 목록.</p>
    </a>
  </section>

  <section style="margin-top:40px" data-admin-box></section>

  <section class="note" style="margin-top:30px">
    수정은 관리자만 할 수 있습니다. 잘못된 내용이 있으면 방에서 운영자에게 알려주세요.
  </section>
</main>

<script src="assets/config.js?v=20260805.1"></script>
<script src="assets/store.js?v=20260805.1"></script>
<script src="assets/app.js?v=20260805.1"></script>
<script>
  document.title = CONFIG.ROOM_NAME + " 안내소";
  App.header("index.html");

  // 관리자면 타일 링크에도 키를 붙여줍니다.
  document.querySelectorAll("[data-tile]").forEach(a => {
    a.href = App.link(a.getAttribute("href"));
  });

  /* ---------- 홈 최근 패치노트 ---------- */
  function pretty(d) {
    const m = (d || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
    return m ? `${m[1]}. ${+m[2]}. ${+m[3]}` : d;
  }
  const CAT_CLASS = { "신규 기능 추가": "cat--new", "오류 수정": "cat--fix", "기존 기능 삭제": "cat--del" };

  function renderPatchHome() {
    const box = document.querySelector("[data-patch-home]");
    const recent = (Store.get().patchnotes || []).slice(-3).reverse();  // 업로드 최신순 상위 3개

    let inner = `<div class="toolbar" style="margin:0 0 14px">
        <h2 style="font-size:18px;font-weight:800;margin:0">📰 최근 패치노트</h2>
        <span class="toolbar__spacer"></span>
        <a class="btn btn--sm" href="${App.link("patchnotes.html")}">전체 보기 →</a>
      </div>`;

    if (!recent.length) {
      inner += `<div class="empty" style="padding:34px 20px">
        <strong>아직 패치노트가 없습니다</strong>바뀐 내용이 생기면 여기에 올라옵니다.</div>`;
    } else {
      inner += `<div class="card" style="padding:6px 10px"><div class="patches">` +
        recent.map(n => `
          <article class="patch">
            <div class="patch__when">
              <span class="patch__date">${App.esc(pretty(n.date))}</span>
              ${n.ver ? `<span class="patch__ver">v${App.esc(n.ver)}</span>` : ""}
            </div>
            <div class="patch__main">
              <span class="patch__cat ${CAT_CLASS[n.cat] || "cat--new"}">${App.esc(n.cat)}</span>
              <p class="patch__body" style="margin:0">${App.esc(n.body)}</p>
            </div>
            <span></span>
          </article>`).join("") +
        `</div></div>`;
    }
    box.innerHTML = inner;
  }

  Store.load().then(renderPatchHome).catch(() => renderPatchHome());

  /* ---------- 관리자 박스 ---------- */
  const box = document.querySelector("[data-admin-box]");
  if (App.isAdmin()) {
    box.innerHTML = `
      <div class="card">
        <h2 style="font-size:17px;margin-bottom:8px">관리자로 보고 있습니다</h2>
        <p style="color:var(--text-dim);font-size:14px;margin:0 0 16px" data-mode></p>
        <div class="field">
          <label class="field__label">일반 공유 주소</label>
          <input class="input" readonly data-share>
        </div>
        <div class="toolbar" style="margin:0">
          <button class="btn btn--primary" data-copy>주소 복사</button>
          <button class="btn" onclick="Store.export()">데이터 내보내기</button>
          <label class="btn" style="display:inline-block">
            데이터 가져오기
            <input type="file" accept="application/json" hidden data-import>
          </label>
        </div>
      </div>
      <div class="card" style="margin-top:16px" data-viewstats>
        <h2 style="font-size:17px;margin-bottom:4px">📊 탭별 하루 평균 조회</h2>
        <p style="color:var(--text-dim);font-size:13px;margin:0 0 12px">한 방문당 1회로 셉니다. (봇·크롤러 제외)</p>
        <div data-views>불러오는 중…</div>
      </div>`;

    const sheetLink = '<a href="' + Store.sheetEditUrl() + '" target="_blank" rel="noopener" style="color:var(--accent-2)">시트 열기</a>';
    const modeText = {
      script: "각 화면에서 추가 · 수정 · 삭제하면 구글 시트에 자동으로 저장됩니다. " + sheetLink,
      sheet: "내용은 구글 시트에서 관리합니다. 시트를 고치면 이 사이트에 바로 반영됩니다. " + sheetLink,
      local: "각 화면에 추가 · 수정 · 삭제 버튼이 보입니다. 다만 지금은 이 브라우저에만 저장되니, 다른 사람에게 보여주려면 시트를 연결하세요."
    };
    box.querySelector("[data-mode]").innerHTML = modeText[Store.MODE];

    const share = location.href.split("?")[0];
    box.querySelector("[data-share]").value = share;
    box.querySelector("[data-copy]").onclick = async () => {
      try { await navigator.clipboard.writeText(share); App.toast("주소를 복사했습니다."); }
      catch (e) { App.toast("복사가 막혀 있습니다. 주소를 직접 선택해 주세요.", true); }
    };

    /* ---------- 탭별 하루 평균 조회 ---------- */
    (async function renderViews() {
      const el = box.querySelector("[data-views]");
      const url = (window.CONFIG && CONFIG.SCRIPT_URL || "").trim();
      if (!url) { el.textContent = "시트 연결(SCRIPT_URL)이 없어 통계를 볼 수 없습니다."; return; }
      let views;
      try {
        const r = await fetch(url + "?action=viewstats&_=" + Date.now(), { redirect: "follow" });
        const j = await r.json();
        if (!j || !j.ok) throw 0;
        views = j.views || [];
      } catch (e) { el.textContent = "조회통계를 불러오지 못했습니다. (재배포 필요할 수 있어요)"; return; }
      if (!views.length) { el.innerHTML = "<div class='empty' style='padding:20px'><strong>아직 조회 기록이 없습니다</strong>사람들이 페이지를 열면 여기에 쌓입니다.</div>"; return; }
      const byPage = {}, dates = {};
      views.forEach(v => { byPage[v.page] = (byPage[v.page] || 0) + v.count; dates[v.date] = 1; });
      const days = Object.keys(dates).length || 1;
      const rows = Object.keys(byPage).map(p => ({ p, total: byPage[p], avg: byPage[p] / days }))
        .sort((a, b) => b.avg - a.avg);
      el.innerHTML =
        "<div class='rows'>" +
        rows.map(x => `<div class="row"><span class="row__k" style="min-width:110px">${App.esc(x.p)}</span>` +
          `<span class="row__v"><b>${x.avg.toFixed(1)}</b>회/일 <span style="color:var(--text-dim)">· 누적 ${x.total}</span></span></div>`).join("") +
        "</div>" +
        `<p style="color:var(--text-dim);font-size:12px;margin:12px 0 0">집계 기간 ${days}일 · 총 ${views.reduce((s, v) => s + v.count, 0)}회</p>`;
    })();
    box.querySelector("[data-import]").onchange = e => {
      const f = e.target.files[0];
      if (!f) return;
      Store.import(f, err => err ? App.toast(err.message, true) : (App.toast("데이터를 가져왔습니다."), renderPatchHome()));
    };
  } else {
    box.innerHTML = `
      <div class="card">
        <h2 style="font-size:17px;margin-bottom:8px">운영자이신가요?</h2>
        <p style="color:var(--text-dim);font-size:14px;margin:0 0 14px">
          관리자 키를 입력하면 수정 화면이 열립니다.
        </p>
        <div class="toolbar" style="margin:0">
          <input class="input" style="max-width:240px" type="password" placeholder="관리자 키" data-key>
          <button class="btn btn--primary" data-in>들어가기</button>
        </div>
      </div>`;
    const input = box.querySelector("[data-key]");
    const go = () => {
      const r = App.signIn(input.value.trim());
      if (r === "ok") location.reload();
      else if (r === "nostorage") App.toast("이 브라우저에서는 로그인 정보를 저장할 수 없습니다. 관리자 링크(주소 뒤 ?key=)로 열어주세요.", true);
      else App.toast("키가 맞지 않습니다.", true);
    };
    box.querySelector("[data-in]").onclick = go;
    input.onkeydown = e => { if (e.key === "Enter") go(); };
  }
</script>
</body>
</html>
