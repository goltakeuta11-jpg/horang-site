<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png?v=20260831.115">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=20260831.115">
<meta property="og:type" content="website">
<meta property="og:title" content="업다운 · 호랑봇 허브">
<meta property="og:description" content="1~100 숨은 숫자를 맞히는 업다운 게임">
<meta property="og:url" content="https://horangbot.co.kr/updown.html">
<meta property="og:image" content="https://horangbot.co.kr/assets/og-image.png">
<meta name="theme-color" content="#12141B">
<script src="assets/inapp.js?v=20260831.115"></script>
<title>업다운 · 호랑봇 허브</title>
<link rel="stylesheet" href="assets/style.css?v=20260831.115">
<style>
  .ud-wrap { max-width: 720px; }
  .ud-setup { display: grid; gap: 14px; grid-template-columns: 1fr 1fr; margin-top: 8px; }
  @media (max-width: 620px) { .ud-setup { grid-template-columns: 1fr; } }
  .ud-box { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 18px; }
  .ud-box h2 { font-size: 16px; font-weight: 800; margin: 0 0 12px; }
  .ud-input { width: 100%; box-sizing: border-box; background: var(--bg); border: 1px solid var(--line);
    color: var(--text); border-radius: 10px; padding: 11px 13px; font: inherit; font-size: 15px; margin-bottom: 10px; }
  .ud-input:focus { outline: none; border-color: var(--accent); }
  /* 상태바 */
  .ud-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--panel);
    border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px 16px; margin-bottom: 14px; }
  .ud-phase { font-size: 17px; font-weight: 800; }
  .ud-code { font-weight: 800; letter-spacing: 2px; background: var(--bg); border: 1px solid var(--line);
    border-radius: 8px; padding: 4px 10px; cursor: pointer; }
  .ud-close { margin-left: auto; background: rgba(255,92,122,.14); border: 1px solid rgba(255,92,122,.5); color: #FF6B81;
    border-radius: 8px; padding: 5px 11px; font: inherit; font-size: 12.5px; font-weight: 800; cursor: pointer; }
  .ud-close:hover { background: rgba(255,92,122,.28); }
  /* 범위 힌트 */
  .ud-range { text-align: center; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 18px; margin-bottom: 14px; }
  .ud-range__big { font-size: 15px; color: var(--text-dim); }
  .ud-range__nums { font-size: 30px; font-weight: 900; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .ud-range__nums b { color: var(--accent); }
  .ud-range__tries { font-size: 12.5px; color: var(--text-dim); margin-top: 6px; }
  /* 입력 */
  .ud-guess { display: flex; gap: 8px; margin-bottom: 14px; }
  .ud-guess input { flex: 1; background: var(--bg); border: 1px solid var(--line); color: var(--text);
    border-radius: 10px; padding: 12px 14px; font: inherit; font-size: 18px; font-weight: 800; text-align: center; }
  .ud-guess input:disabled { opacity: .5; }
  /* 결과 */
  .ud-win { text-align: center; padding: 18px; border-radius: var(--radius-sm); font-weight: 800; font-size: 20px; margin-bottom: 14px;
    background: rgba(52,211,153,.16); color: #34D399; border: 1px solid #34D399; }
  /* 기록 */
  .ud-hist { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px 14px; max-height: 300px; overflow-y: auto; }
  .ud-hist h3 { font-size: 13px; color: var(--text-dim); font-weight: 700; margin: 2px 0 8px; }
  .ud-g { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .ud-g:last-child { border-bottom: 0; }
  .ud-g__num { font-weight: 900; font-variant-numeric: tabular-nums; min-width: 42px; }
  .ud-g__nick { color: var(--text-dim); font-size: 12.5px; }
  .ud-g__tag { margin-left: auto; font-weight: 800; font-size: 13px; }
  .ud-up { color: #FF9E6B; } .ud-down { color: #7FA8FF; } .ud-hit { color: #34D399; }
  /* 점수판 */
  .ud-score { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .ud-score span { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; font-size: 12.5px; font-weight: 700; }
  .ud-reconnect { background: rgba(255,92,122,.16); border: 1px solid #FF6B81; color: #FF6B81; border-radius: 10px; padding: 9px 14px; margin-bottom: 12px; font-size: 13px; font-weight: 700; text-align: center; }
</style>
</head>
<body>

<header class="header"><div class="header__inner" data-header></div></header>

<main class="wrap page ud-wrap">
  <p class="page__eyebrow"><a href="game.html" style="color:inherit;text-decoration:none">🎮 게임</a> › 업다운</p>
  <h1 class="page__title">🔢 업다운</h1>

  <div data-noserver hidden class="empty" style="padding:30px"><strong>이 게임은 호랑봇 서버에서만 돌아가요</strong>horangbot.co.kr 에서 접속해주세요.</div>

  <!-- 셋업 -->
  <section data-setup hidden>
    <p class="page__desc">1~100 중 숨은 숫자를 맞혀요! 부른 숫자가 높으면 ⬇️ 다운, 낮으면 ⬆️ 업. 먼저 맞히는 사람이 승리!</p>
    <p class="mf-hint" data-create-note hidden style="margin:-4px 0 12px;color:var(--text-dim)">💡 방 생성은 관리자만 할 수 있어요. 관리자가 만든 방 코드를 받아 참가해주세요.</p>
    <div class="ud-setup">
      <div class="ud-box" data-create-box>
        <h2>➕ 방 만들기</h2>
        <input class="ud-input" data-create-nick maxlength="16" placeholder="내 닉네임">
        <button class="btn btn--primary" data-create style="width:100%">방 만들기</button>
      </div>
      <div class="ud-box">
        <h2>🚪 방 참가</h2>
        <input class="ud-input" data-join-code maxlength="4" placeholder="방 코드 (4자리)" style="text-transform:uppercase">
        <input class="ud-input" data-join-nick maxlength="16" placeholder="내 닉네임">
        <button class="btn btn--primary" data-join style="width:100%">참가하기</button>
      </div>
    </div>
  </section>

  <!-- 게임 -->
  <section data-game hidden>
    <div class="ud-reconnect" data-reconnect hidden>🔄 서버와 연결이 잠깐 끊겼어요. 다시 연결 중…</div>
    <div class="ud-bar">
      <span class="ud-phase" data-phase>—</span>
      <span class="ud-code" data-code title="코드 복사"></span>
      <button class="ud-close" data-closeroom hidden title="방 닫기">💥 방 닫기</button>
    </div>

    <div class="ud-win" data-win hidden></div>

    <div class="ud-score" data-score></div>

    <div class="ud-range">
      <div class="ud-range__big" data-range-label>이 사이에 숨어있어요</div>
      <div class="ud-range__nums" data-range></div>
      <div class="ud-range__tries" data-tries></div>
    </div>

    <div class="ud-guess">
      <input data-guess-input type="number" min="1" max="100" inputmode="numeric" placeholder="1~100 숫자 입력">
      <button class="btn btn--primary" data-guess-btn>입력</button>
    </div>

    <div data-restart-wrap hidden style="text-align:center;margin-bottom:14px">
      <button class="btn btn--primary" data-restart>🔄 새 라운드 (같은 방)</button>
    </div>

    <div class="ud-hist">
      <h3>📜 추측 기록</h3>
      <div data-hist></div>
    </div>
  </section>
</main>

<script src="assets/config.js?v=20260831.115"></script>
<script src="assets/store.js?v=20260831.115"></script>
<script src="assets/app.js?v=20260831.115"></script>
<script>
App.header("game.html");

const UD_URL = ((window.CONFIG && CONFIG.SCRIPT_URL) === "/api/gs") ? "/api/updown" : null;
const LS = "horang.updown";
const $ = s => document.querySelector(s);
const esc = (App && App.esc) ? App.esc : (s => ("" + s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])));

let sess = null, sinceId = 0, pollTimer = null, polling = false, S = null;
try { sess = JSON.parse(localStorage.getItem(LS) || "null"); } catch (e) {}
function saveSess(s) { sess = s; try { localStorage.setItem(LS, JSON.stringify(s)); } catch (e) {} }
function clearSess() { sess = null; try { localStorage.removeItem(LS); } catch (e) {} }

async function api(op, extra) {
  const body = Object.assign({ op }, sess ? { code: sess.code, pid: sess.pid } : {}, extra || {});
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 8000);
  try {
    const r = await fetch(UD_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body), signal: ctrl.signal });
    return await r.json();
  } finally { clearTimeout(t); }
}
function show(which) {
  $("[data-noserver]").hidden = which !== "noserver";
  $("[data-setup]").hidden = which !== "setup";
  $("[data-game]").hidden = which !== "game";
}

/* 셋업 */
$("[data-create]").onclick = async () => {
  const nick = $("[data-create-nick]").value.trim();
  if (!nick) return App.toast("닉네임을 입력해주세요.");
  const j = await api("create", { nick, key: App.key() });
  if (!j.ok) return App.toast(j.error || "방 생성 실패");
  saveSess({ code: j.code, pid: j.pid }); sinceId = 0; startGame();
};
$("[data-join]").onclick = async () => {
  const code = $("[data-join-code]").value.trim().toUpperCase();
  const nick = $("[data-join-nick]").value.trim();
  if (!code || !nick) return App.toast("코드와 닉네임을 입력해주세요.");
  const j = await api("join", { code, nick });
  if (!j.ok) return App.toast(j.error || "참가 실패");
  saveSess({ code: j.code, pid: j.pid }); sinceId = 0; startGame();
};

/* 폴링 */
function startGame() { show("game"); startPoll(); }
function startPoll() { stopPoll(); poll(); pollTimer = setInterval(poll, 1500); }
function stopPoll() { clearInterval(pollTimer); pollTimer = null; }
let pollFails = 0;
async function poll() {
  if (polling) return;
  polling = true;
  let j;
  try { j = await api("state", { since: sinceId }); }
  catch (e) { pollFails++; if (pollFails >= 2) { const rc = $("[data-reconnect]"); if (rc) rc.hidden = false; } return; }
  finally { polling = false; }
  if (pollFails) { pollFails = 0; const rc = $("[data-reconnect]"); if (rc) rc.hidden = true; }
  if (!j.ok) { if (j.gone) { clearSess(); stopPoll(); show("setup"); App.toast(j.error || "다시 입장해주세요."); } return; }
  S = j;
  if (j.msgs) for (const m of j.msgs) if (m.id > sinceId) sinceId = m.id;
  try { render(j); } catch (e) { console.error("[updown] render error:", e); }
}

/* 렌더 */
function render(j) {
  $("[data-phase]").textContent = (j.over ? "🏁 라운드 종료" : "🔢 진행 중") + (j.round ? " · " + j.round + "라운드" : "");
  const codeEl = $("[data-code]"); codeEl.textContent = j.code;
  codeEl.onclick = () => { navigator.clipboard && navigator.clipboard.writeText(j.code); App.toast("코드 복사됨: " + j.code); };
  $("[data-closeroom]").hidden = !j.isHost;

  // 승리 배너
  const winEl = $("[data-win]");
  if (j.over && j.winner) { winEl.hidden = false; winEl.innerHTML = `🎯 <b>${esc(j.winner)}</b>님 정답! (숨은 숫자: <b>${j.secret}</b>)`; }
  else winEl.hidden = true;

  // 점수판
  $("[data-score]").innerHTML = (j.players || []).slice().sort((a, b) => b.score - a.score)
    .map(p => `<span>${p.isMe ? "⭐ " : ""}${esc(p.nick)} ${p.score}점${p.host ? " 👑" : ""}</span>`).join("");

  // 범위
  const rangeEl = $("[data-range]"), rlabel = $("[data-range-label]");
  if (j.over) { rlabel.textContent = "정답은"; rangeEl.innerHTML = `<b>${j.secret}</b>`; }
  else { rlabel.textContent = "이 사이에 숨어있어요"; rangeEl.innerHTML = `<b>${j.lo}</b> ~ <b>${j.hi}</b>`; }
  $("[data-tries]").textContent = "지금까지 " + (j.tries || 0) + "번 추측";

  // 입력/재시작
  const inp = $("[data-guess-input]"), gbtn = $("[data-guess-btn]");
  inp.disabled = j.over; gbtn.disabled = j.over;
  $("[data-restart-wrap]").hidden = !(j.over && j.isHost);

  // 기록
  $("[data-hist]").innerHTML = (j.guesses || []).slice().reverse().map(g => {
    const tag = g.hint === "hit" ? `<span class="ud-g__tag ud-hit">🎯 정답!</span>`
      : g.hint === "down" ? `<span class="ud-g__tag ud-down">⬇️ 다운</span>`
      : `<span class="ud-g__tag ud-up">⬆️ 업</span>`;
    return `<div class="ud-g"><span class="ud-g__num">${g.num}</span><span class="ud-g__nick">${esc(g.nick)}</span>${tag}</div>`;
  }).join("") || `<p class="mf-hint" style="color:var(--text-dim);font-size:13px">아직 추측이 없어요. 숫자를 입력해보세요!</p>`;
}

/* 추측 */
async function doGuess() {
  const inp = $("[data-guess-input]");
  const n = parseInt(inp.value, 10);
  if (!(n >= 1 && n <= 100)) return App.toast("1~100 사이 숫자를 입력해주세요.");
  inp.value = "";
  const r = await api("guess", { num: n });
  if (!r.ok) { App.toast(r.error || "입력 실패"); return; }
  if (r.hint === "hit") App.toast("🎯 정답!");
  else App.toast(r.hint === "down" ? "⬇️ 다운! 더 낮게" : "⬆️ 업! 더 높게");
  poll();
  inp.focus();
}
$("[data-guess-btn]").onclick = doGuess;
$("[data-guess-input]").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); doGuess(); } });

$("[data-restart]").onclick = async () => { const r = await api("restart"); if (!r.ok) App.toast(r.error); else poll(); };
$("[data-closeroom]").onclick = async () => {
  if (!confirm("방을 닫을까요? 모두 나가집니다.")) return;
  const r = await api("closeroom");
  if (r && !r.ok && !r.gone) { App.toast(r.error || "방을 닫지 못했어요."); return; }
  clearSess(); stopPoll(); show("setup"); App.toast("💥 방을 닫았어요.");
};

/* 시작 */
if (!App.isAdmin()) {   // 방 생성은 관리자만
  const cb = $("[data-create-box]"), note = $("[data-create-note]");
  if (cb) cb.hidden = true;
  if (note) note.hidden = false;
  const setup = document.querySelector(".ud-setup");
  if (setup) setup.style.gridTemplateColumns = "1fr";
}
if (!UD_URL) show("noserver");
else if (sess) startGame();
else show("setup");
window.addEventListener("beforeunload", stopPoll);
</script>
</body>
</html>
