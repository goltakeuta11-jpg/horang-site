<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta property="og:url" content="https://horangbot.co.kr/admin.html">
<meta property="og:image" content="https://horangbot.co.kr/assets/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png?v=20260831.100">
<link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png?v=20260831.100">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=20260831.100">
<meta name="theme-color" content="#12141B">
<script src="assets/inapp.js?v=20260831.100"></script>
<title>관리전용 · 호랑봇 허브</title>
<link rel="stylesheet" href="assets/style.css?v=20260831.100">
<style>
  .adm-guard { text-align: center; color: var(--text-dim); padding: 60px 20px; font-size: 15px; }
  .adm-wrap { display: grid; grid-template-columns: 240px 1fr; gap: 16px; align-items: start; }
  @media (max-width: 720px) { .adm-wrap { grid-template-columns: 1fr; } }
  .adm-list { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px; }
  .adm-list h3 { font-size: 13px; color: var(--text-dim); margin: 2px 4px 8px; font-weight: 700; }
  .adm-doc { display: block; width: 100%; text-align: left; background: none; border: none; color: var(--text);
             padding: 8px 10px; border-radius: 6px; cursor: pointer; font: inherit; }
  .adm-doc:hover { background: var(--panel-2, rgba(127,127,127,.12)); }
  .adm-doc.is-on { background: rgba(255,92,122,.14); font-weight: 700; }
  .adm-doc small { display: block; color: var(--text-dim); font-size: 11px; font-variant-numeric: tabular-nums; }
  .adm-editor { min-width: 0; }
  .adm-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .adm-row .input { flex: 1; min-width: 160px; }
  .adm-ta { width: 100%; box-sizing: border-box; min-height: 62vh; resize: vertical;
            font-family: var(--font-mono, ui-monospace, monospace); font-size: 13px; line-height: 1.5;
            background: var(--panel); color: var(--text); border: 1px solid var(--line);
            border-radius: var(--radius-sm); padding: 12px; white-space: pre; overflow: auto; tab-size: 2; }
  .adm-meta { color: var(--text-dim); font-size: 12px; margin-top: 8px; display: flex; gap: 14px; flex-wrap: wrap;
              font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<header class="header"><div class="header__inner" data-header></div></header>

<main class="wrap page">
  <h1 class="page__title">관리전용 🔧</h1>
  <p class="page__desc">봇 코드 등 긴 텍스트를 서버에 저장/보관합니다. (글자수 제한 없음 · 서버 DB 저장 · 매일 자동 백업)</p>
  <section data-admin></section>
</main>

<script src="assets/config.js?v=20260831.100"></script>
<script src="assets/store.js?v=20260831.100"></script>
<script src="assets/app.js?v=20260831.100"></script>
<script>
App.header("admin.html");

const el = document.querySelector("[data-admin]");
const KEY = App.key();   // 서버 로그인 토큰(관리자)
const URL_ = (window.CONFIG && CONFIG.SCRIPT_URL || "").trim();
let current = null;   // 현재 열려있는 문서 이름

async function api(payload) {
  const r = await fetch(URL_, {
    method: "POST", redirect: "follow",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(Object.assign({ key: KEY }, payload))
  });
  return r.json();
}

function render() {
  if (!App.isAdmin()) {
    el.innerHTML = '<div class="adm-guard">🔒 관리자만 접근할 수 있어요.<br>홈 화면에서 관리자 비밀번호로 로그인해 주세요.</div>';
    return;
  }
  el.innerHTML = `
    <div class="adm-wrap">
      <aside class="adm-list">
        <h3>저장된 문서</h3>
        <div data-docs><span class="muted" style="padding:8px 10px;display:block">불러오는 중…</span></div>
        <button class="btn btn--ghost btn--sm" data-new style="width:100%;margin-top:8px">+ 새 문서</button>
      </aside>
      <div class="adm-editor">
        <div class="adm-row">
          <input class="input" data-name placeholder="문서 이름 (예: 공주봇_v2.js)" autocomplete="off">
          <button class="btn btn--primary" data-save>저장</button>
          <button class="btn btn--danger btn--sm" data-del>삭제</button>
        </div>
        <textarea class="adm-ta" data-code placeholder="여기에 붙여넣기 (글자수 제한 없음)" spellcheck="false"></textarea>
        <div class="adm-meta">
          <span data-count>0 자</span>
          <span data-updated></span>
        </div>
      </div>
    </div>`;
  bind();
  loadList();
}

function bind() {
  const ta = el.querySelector("[data-code]");
  const cnt = el.querySelector("[data-count]");
  ta.addEventListener("input", () => cnt.textContent = ta.value.length.toLocaleString() + " 자");
  el.querySelector("[data-save]").onclick = save;
  el.querySelector("[data-del]").onclick = del;
  el.querySelector("[data-new]").onclick = () => {
    current = null;
    el.querySelector("[data-name]").value = "";
    ta.value = ""; cnt.textContent = "0 자";
    el.querySelector("[data-updated]").textContent = "";
    highlight();
  };
}

async function loadList() {
  const box = el.querySelector("[data-docs]");
  try {
    const r = await api({ adminAction: "list" });
    if (!r.ok) throw new Error(r.error || "실패");
    const docs = r.docs || [];
    box.innerHTML = docs.length
      ? docs.map(d => `<button class="adm-doc" data-doc="${App.esc(d.name)}">${App.esc(d.name)}
          <small>${(d.len || 0).toLocaleString()}자 · ${App.esc(d.updated || "")}</small></button>`).join("")
      : '<span class="muted" style="padding:8px 10px;display:block">아직 없음</span>';
    box.querySelectorAll("[data-doc]").forEach(b => b.onclick = () => open(b.getAttribute("data-doc")));
    highlight();
  } catch (e) { box.innerHTML = '<span class="stk-err" style="padding:8px 10px;display:block">목록 오류</span>'; }
}

function highlight() {
  el.querySelectorAll("[data-doc]").forEach(b =>
    b.classList.toggle("is-on", b.getAttribute("data-doc") === current));
}

async function open(name) {
  try {
    const r = await api({ adminAction: "load", name });
    if (!r.ok) throw new Error(r.error || "실패");
    current = name;
    el.querySelector("[data-name]").value = name;
    const ta = el.querySelector("[data-code]");
    ta.value = (r.doc && r.doc.content) || "";
    el.querySelector("[data-count]").textContent = ta.value.length.toLocaleString() + " 자";
    el.querySelector("[data-updated]").textContent = r.doc && r.doc.updated ? "수정: " + r.doc.updated : "";
    highlight();
    App.toast("불러왔어요: " + name);
  } catch (e) { App.toast("불러오기 실패", true); }
}

async function save() {
  const name = (el.querySelector("[data-name]").value || "").trim();
  const content = el.querySelector("[data-code]").value;
  if (!name) return App.toast("문서 이름을 입력해주세요.", true);
  const btn = el.querySelector("[data-save]");
  btn.disabled = true; btn.textContent = "저장 중…";
  try {
    const r = await api({ adminAction: "save", name, content });
    if (!r.ok) throw new Error(r.error || "실패");
    current = name;
    el.querySelector("[data-updated]").textContent = "수정: " + (r.updated || "");
    App.toast("저장했어요 (" + content.length.toLocaleString() + "자)");
    await loadList();
  } catch (e) { App.toast("저장 실패: " + e.message, true); }
  finally { btn.disabled = false; btn.textContent = "저장"; }
}

async function del() {
  const name = (el.querySelector("[data-name]").value || "").trim();
  if (!name) return App.toast("삭제할 문서 이름이 없어요.", true);
  if (!confirm("'" + name + "' 문서를 삭제할까요?")) return;
  try {
    const r = await api({ adminAction: "delete", name });
    if (!r.ok) throw new Error(r.error || "실패");
    current = null;
    el.querySelector("[data-name]").value = "";
    el.querySelector("[data-code]").value = "";
    el.querySelector("[data-count]").textContent = "0 자";
    el.querySelector("[data-updated]").textContent = "";
    App.toast("삭제했어요.");
    await loadList();
  } catch (e) { App.toast("삭제 실패", true); }
}

render();
</script>
</body>
</html>
