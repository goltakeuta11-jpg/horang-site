<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta property="og:type" content="website">
<meta property="og:title" content="호랑봇 안내소">
<meta property="og:description" content="봇 명령어 · 자소서 · 외출 · 패치노트를 한 곳에서.">
<meta name="theme-color" content="#12141B">
<script src="assets/inapp.js?v=20260831.1"></script>
<title>자소서 · 호랑봇 안내소</title>
<link rel="stylesheet" href="assets/style.css?v=20260831.1">
</head>
<body>

<header class="header"><div class="header__inner" data-header></div></header>

<main class="wrap page">
  <p class="page__eyebrow" data-eyebrow>자소서</p>
  <h1 class="page__title" data-title>방 사람들 자기소개</h1>
  <p class="page__desc">누구나 자기 소개를 <b>등록 · 수정</b>할 수 있어요. (삭제는 운영자만)</p>

  <div class="toolbar">
    <input class="input" style="max-width:260px" placeholder="닉네임 · 취미 · MBTI 검색" data-search>
    <span class="toolbar__spacer"></span>
    <span data-admin-tools></span>
  </div>

  <div class="toolbar" data-typebar style="gap:6px;flex-wrap:wrap;margin-top:-4px"></div>
  <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
    <p style="font-style:italic;color:var(--text-dim);font-size:13px;margin:-2px 0 6px">심리테스트를 아직 기입하지 않은 사람은 미분류에서 찾을 수 있습니다!</p>
    <span data-count style="color:var(--text-dim);font-size:13px;white-space:nowrap"></span>
  </div>

  <div class="grid grid--2" data-list></div>
  <nav data-pager style="display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap;margin:22px 0 4px"></nav>
</main>

<!-- 자소서 입력 창 -->
<div class="modal" data-modal>
  <div class="modal__box">
    <h2 class="modal__title" data-modal-title>새 인원 추가</h2>
    <div data-form></div>
    <div class="modal__foot">
      <button class="btn btn--ghost" data-cancel>취소</button>
      <button class="btn btn--primary" data-save>저장</button>
    </div>
  </div>
</div>

<script src="assets/config.js?v=20260831.1"></script>
<script src="assets/store.js?v=20260831.1"></script>
<script src="assets/app.js?v=20260831.1"></script>
<script>
// 이 탭이 담당하는 성별 (?g=남자 / ?g=여자, 기본 남자)
const GENDER = new URLSearchParams(location.search).get("g") === "여자" ? "여자" : "남자";

App.header("members.html?g=" + GENDER);
document.title = GENDER + " 자소서 · 호랑봇 안내소";
document.querySelector("[data-eyebrow]").textContent = GENDER + " 자소서";
document.querySelector("[data-title]").textContent = GENDER + " 방 사람들 자기소개";

const admin = App.isAdmin();
const readOnly = !Store.canWrite;      // 읽기전용(CSV) 시트 모드면 아무도 못 씀
const canWrite = !readOnly;            // 자소서는 누구나 등록·수정
const canDelete = admin && !readOnly;  // 삭제는 운영자만
const listEl = document.querySelector("[data-list]");
const modal = document.querySelector("[data-modal]");
let editIndex = -1;

/* 연애유형 (심리테스트 결과) — 6종. 아직 안 한 사람은 "미분류" */
const TYPES = ["심약핑", "도망핑", "노잼핑", "모험핑", "집착핑", "미분류"];

/* 자소서 양식 — 성별은 탭이 정하므로 폼에는 없음 */
const FORM = [
  { k: "nick",   label: "닉네임",          type: "text" },
  { k: "age",    label: "나이",            type: "text" },
  { k: "height", label: "키",              type: "text" },
  { k: "region", label: "사는 곳",          type: "text" },
  { k: "job",    label: "전공 or 직업",     type: "text" },
  { k: "off",    label: "쉬는 요일",        type: "text" },
  { k: "hobby",  label: "취미",            type: "text" },
  { k: "mbti",   label: "MBTI",           type: "text" },
  { k: "charm",  label: "본인의 매력",      type: "area" },
  { k: "ideal",  label: "이상형",          type: "area" },
  { k: "smoke",  label: "흡연유무 & 주량",  type: "text" },
  { k: "say",    label: "하고싶은 말",      type: "area" },
  { k: "type",   label: "심리테스트유형 (심리테스트 진행후에 입력해주세요)", type: "select", options: TYPES }
];

const tools = document.querySelector("[data-admin-tools]");
if (readOnly) {
  if (admin) tools.innerHTML = `<a class="btn btn--primary" target="_blank" rel="noopener" href="${Store.sheetEditUrl()}">시트에서 수정하기</a>`;
} else {
  tools.innerHTML = `<button class="btn btn--primary" data-add>${GENDER} 등록</button>`;
  tools.querySelector("[data-add]").onclick = () => open(-1);
}

function card(m, i) {
  return `
    <article class="card member">
      <div class="member__top">
        <span class="member__nick">${App.esc(m.nick)}${m.pw ? ` <span title="비밀번호로 보호됨" style="font-size:12px;opacity:.7">🔒</span>` : ""}</span>
        <span class="member__meta">${[m.age && m.age + "세", m.height && m.height + "cm", m.region].filter(Boolean).map(App.esc).join(" · ")}</span>
        ${m.mbti ? `<span class="member__mbti">${App.esc(m.mbti)}</span>` : ""}
        ${m.type && m.type !== "미분류" ? `<span class="member__mbti" style="white-space:nowrap;font-size:11px;padding:2px 6px">💘 ${App.esc(m.type)}</span>` : ""}
      </div>
      <div class="rows">
        ${FORM.filter(f => !["nick", "age", "height", "region", "mbti", "type"].includes(f.k) && m[f.k])
          .map(f => `<div class="row"><span class="row__k">${f.label}</span><span class="row__v">${App.esc(m[f.k])}</span></div>`)
          .join("")}
      </div>
      ${canWrite ? `<div class="member__tools">
        <button class="btn btn--sm btn--ghost" data-edit="${i}">수정</button>
        ${canDelete ? `<button class="btn btn--sm btn--danger" data-del="${i}">삭제</button>` : ""}
      </div>` : ""}
    </article>`;
}

/* 연애유형 필터 탭 (전체 + 6종) */
let typeFilter = "전체";
function renderTypeBar() {
  const bar = document.querySelector("[data-typebar]");
  bar.innerHTML = ["전체"].concat(TYPES).map(t =>
    `<button class="btn btn--sm ${t === typeFilter ? "btn--primary" : "btn--ghost"}" data-type="${t}">${t}</button>`).join("");
  bar.querySelectorAll("[data-type]").forEach(b => b.onclick = () => { typeFilter = b.dataset.type; page = 1; renderTypeBar(); render(); });
}

/* 페이지네이션 */
const PER_PAGE = 12;   // 한 페이지에 보여줄 자소서 수 (2열이라 6줄)
let page = 1;

/* 페이지 번호 창: 1 … 4 5 6 … 20 형태 (많아도 버튼 안 넘치게) */
function pageWindow(cur, total) {
  const out = [];
  for (let n = 1; n <= total; n++) {
    if (n === 1 || n === total || Math.abs(n - cur) <= 1) out.push(n);
    else if (out[out.length - 1] !== "…") out.push("…");
  }
  return out;
}

function renderPager(totalPages) {
  const pager = document.querySelector("[data-pager]");
  if (totalPages <= 1) { pager.innerHTML = ""; return; }
  let html = `<button class="btn btn--sm btn--ghost" data-pg="prev"${page === 1 ? " disabled" : ""}>← 이전</button>`;
  pageWindow(page, totalPages).forEach(n => {
    html += n === "…"
      ? `<span style="color:var(--text-dim);padding:0 2px">…</span>`
      : `<button class="btn btn--sm ${n === page ? "btn--primary" : "btn--ghost"}" data-pg="${n}">${n}</button>`;
  });
  html += `<button class="btn btn--sm btn--ghost" data-pg="next"${page === totalPages ? " disabled" : ""}>다음 →</button>`;
  pager.innerHTML = html;
  pager.querySelectorAll("[data-pg]").forEach(b => b.onclick = () => {
    const v = b.dataset.pg;
    if (v === "prev") page = Math.max(1, page - 1);
    else if (v === "next") page = Math.min(totalPages, page + 1);
    else page = +v;
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
}

/* 검색 대상 — 비번 해시(pw)와 등록일(at)은 화면에 없는 값이라 검색에서도 뺍니다.
   (안 빼면 "2026" 같은 걸 치면 전원이 걸립니다) */
const HIDDEN_KEYS = ["pw", "at"];

/* 화면 표시용이 아니라 정렬용 임시 도장 (서버 값이 오면 덮어써짐).
   ★ Code.gs 의 stampAt() 과 반드시 같은 꼴 "yyyy-MM-dd HH:mm:ss" — 자리수가 어긋나면 문자열 비교가 깨집니다. */
function nowStamp() {
  const d = new Date(), p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate())
       + " " + p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
}

function searchText(m) {
  return Object.keys(m).filter(k => HIDDEN_KEYS.indexOf(k) < 0)
    .map(k => m[k]).join(" ").toLowerCase();
}

/* 정렬 — 웹은 "최신이 위". 시트(Code.gs sortMembersAsc)는 정확히 이것의 반대.
     · 등록일이 있는 사람끼리: 최신 → 오래된 순
     · 등록일이 없는 사람(이 기능 이전부터 있던 멤버 100명)은 전부 아래로 몰되,
       자기들끼리는 시트 행 순서를 뒤집어 정렬합니다. 시트가 등록순이라 아래쪽일수록 나중 사람이거든요.
       ※ 만약 시트를 가나다순 같은 걸로 다시 정렬한다면 이 줄은 의미를 잃습니다(뒤집힌 가나다가 됨). */
function sortNewestFirst(a, b) {
  const A = a.m.at || "", B = b.m.at || "";
  if (!A && !B) return b.i - a.i;   // 둘 다 옛날 사람 → 시트 아래쪽(나중 등록)이 위로
  if (!A) return 1;                 // 등록일 없는 쪽이 아래
  if (!B) return -1;
  if (A === B) return b.i - a.i;    // 같은 시각이면 시트 뒤쪽(나중에 들어간 쪽)이 위
  return A < B ? 1 : -1;
}

function render() {
  const q = (document.querySelector("[data-search]").value || "").toLowerCase().trim();
  const all = Store.get().members;
  const list = all.map((m, i) => ({ m, i }))
    .filter(({ m }) => m.gender === GENDER &&
      (typeFilter === "전체" || (m.type || "미분류") === typeFilter) &&
      (!q || searchText(m).includes(q)))
    .sort(sortNewestFirst);   // ★ 최신 등록이 맨 위로 (시트는 반대로 오래된 것이 위)

  const countEl = document.querySelector("[data-count]");
  if (!list.length) {
    if (countEl) countEl.textContent = "";
    listEl.innerHTML = `<div class="empty" style="grid-column:1/-1">
      <strong>보여줄 ${GENDER} 멤버가 없습니다${typeFilter !== "전체" ? " (" + typeFilter + ")" : ""}</strong>${canWrite ? "‘" + GENDER + " 등록’으로 첫 소개를 남겨보세요." : "운영자가 등록하면 여기에 나타납니다."}</div>`;
    renderPager(1);
    return;
  }

  const totalPages = Math.max(1, Math.ceil(list.length / PER_PAGE));
  if (page > totalPages) page = totalPages;   // 삭제·필터로 범위 벗어나면 클램프
  const start = (page - 1) * PER_PAGE;
  const pageItems = list.slice(start, start + PER_PAGE);

  if (countEl) countEl.textContent = `총 ${list.length}명` + (totalPages > 1 ? ` · ${page}/${totalPages}쪽` : "");
  listEl.innerHTML = pageItems.map(({ m, i }) => card(m, i)).join("");

  if (canWrite) listEl.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => gateThenOpen(+b.dataset.edit));
  if (canDelete) listEl.querySelectorAll("[data-del]").forEach(b => b.onclick = () => remove(+b.dataset.del));
  renderPager(totalPages);
}

/* 비번 게이트 — 잠긴 자소서는 비번 맞아야 수정창이 열림 (관리자는 프리패스) */
async function gateThenOpen(i) {
  const m = Store.get().members[i];
  if (m && m.pw && !admin) {
    const input = prompt(`🔒 "${m.nick}"님 자소서를 수정하려면\n비밀번호를 입력하세요:`);
    if (input == null) return;                       // 취소
    const h = await App.sha256(input.trim());
    if (h !== m.pw) return App.toast("비밀번호가 틀렸어요.", true);
  }
  open(i);
}

function open(i) {
  editIndex = i;
  const m = i < 0 ? {} : Store.get().members[i];
  document.querySelector("[data-modal-title]").textContent = i < 0 ? GENDER + " 등록" : App.esc(m.nick) + " 수정";
  document.querySelector("[data-form]").innerHTML = FORM.map(f => `
    <label class="field"><span class="field__label">${f.label}</span>
      ${f.type === "select"
        ? `<select class="select" data-k="${f.k}">${f.options.map(o => `<option${(m[f.k] || "미분류") === o ? " selected" : ""}>${o}</option>`).join("")}</select>`
        : f.type === "area"
        ? `<textarea class="textarea" data-k="${f.k}">${App.esc(m[f.k] || "")}</textarea>`
        : `<input class="input" data-k="${f.k}" value="${App.esc(m[f.k] || "")}">`}
    </label>`).join("")
    + `<label class="field"><span class="field__label">🔒 ${i < 0 ? "비밀번호 설정 (선택)" : "새 비밀번호 (안 바꾸려면 비워두세요)"}</span>
        <input class="input" type="password" data-pw value="" autocomplete="new-password" placeholder="${i < 0 || !m.pw ? "설정하면 본인만 수정할 수 있어요" : "비우면 기존 비번 그대로 유지"}"></label>`
    + `<p style="color:var(--text-dim);font-size:13px;line-height:1.6;margin:8px 0 0;padding:12px;background:rgba(255,255,255,.04);border-radius:10px">🔒 <b>비밀번호를 설정하면 본인만 수정</b>할 수 있어요. 분실 시 관리자에게 문의하세요. (완벽 보안이 아닌 간이 잠금이에요)</p>`;
  modal.classList.add("is-on");
  modal.querySelector("[data-k]").focus();
}

function close() { modal.classList.remove("is-on"); }
document.querySelector("[data-cancel]").onclick = close;
modal.onclick = e => { if (e.target === modal) close(); };

document.querySelector("[data-save]").onclick = async () => {
  const item = {};
  modal.querySelectorAll("[data-k]").forEach(el => item[el.dataset.k] = el.value.trim());
  if (!item.nick) return App.toast("닉네임은 반드시 적어주세요.", true);
  item.gender = GENDER;   // 이 탭의 성별로 저장
  /* 비밀번호: 입력하면 원문 전송(서버가 시트엔 원문 저장) · 비우면 기존값(해시) 그대로 → 서버가 원문 유지 */
  const pwEl = modal.querySelector("[data-pw]");
  const pwVal = pwEl ? pwEl.value.trim() : "";
  const prev = editIndex < 0 ? null : Store.get().members[editIndex];
  item.pw = pwVal ? pwVal : (prev ? (prev.pw || "") : "");
  /* 등록일: 수정이면 기존 값 그대로(빈칸이면 빈칸 유지), 새 등록이면 지금 시각을 임시로 채움.
     시트에 실제로 들어가는 값은 서버가 KST 기준으로 다시 정합니다(브라우저 시계는 안 믿음).
     그래도 여기서 채워둬야 방금 등록한 사람이 새로고침 전에도 목록 맨 위에 바로 보입니다. */
  item.at = prev ? (prev.at || "") : nowStamp();
  const data = Store.get();
  if (editIndex < 0) data.members.push(item); else data.members[editIndex] = item;
  if (!Store.set(data)) return;   // 저장 차단(로드 전)이면 성공처리·화면갱신 안 함
  if (editIndex < 0) page = 1;    // 새로 등록하면 최신이 맨 위(1쪽)라 1쪽으로 이동해 보여줌
  close(); render();
  App.toast(editIndex < 0 ? item.nick + "님을 등록했습니다." : "수정했습니다.");
};

function remove(i) {
  const data = Store.get();
  if (!confirm(`${data.members[i].nick}님의 소개를 삭제할까요?`)) return;
  data.members.splice(i, 1);
  if (!Store.set(data)) return;   // 저장 차단(로드 전)이면 성공처리·화면갱신 안 함
  render();
  App.toast("삭제했습니다.");
}

document.querySelector("[data-search]").oninput = () => { page = 1; render(); };
renderTypeBar();   // 연애유형 필터 탭

/* 서버 모드면 데이터를 받아온 뒤 그립니다. 아니면 즉시 그립니다. */
Store.load()
  .then(render)
  .catch(e => { render(); App.toast(e.message, true); });
</script>
</body>
</html>
