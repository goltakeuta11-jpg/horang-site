<style>
  .mf-wrap { max-width: 900px; }
  /* 셋업 */
  .mf-setup { display: grid; gap: 14px; grid-template-columns: 1fr 1fr; margin-top: 8px; }
  @media (max-width: 620px) { .mf-setup { grid-template-columns: 1fr; } }
  .mf-box { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 18px; }
  .mf-box h2 { font-size: 16px; font-weight: 800; margin: 0 0 12px; }
  .mf-input { width: 100%; box-sizing: border-box; background: var(--bg); border: 1px solid var(--line);
    color: var(--text); border-radius: 10px; padding: 11px 13px; font: inherit; font-size: 15px; margin-bottom: 10px; }
  .mf-input:focus { outline: none; border-color: var(--accent); }
  /* 상태바 */
  .mf-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--panel);
    border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px 16px; margin-bottom: 14px; }
  .mf-phase { font-size: 17px; font-weight: 800; }
  .mf-timer { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 800; font-size: 18px; color: var(--accent); }
  .mf-code { font-weight: 800; letter-spacing: 2px; background: var(--bg); border: 1px solid var(--line);
    border-radius: 8px; padding: 4px 10px; cursor: pointer; }
  .mf-role { font-weight: 800; padding: 3px 10px; border-radius: 999px; font-size: 13px; }
  .role-mafia { background: rgba(255,92,122,.18); color: #FF6B81; }
  .role-citizen { background: rgba(120,160,255,.16); color: #7FA8FF; }
  .role-doctor { background: rgba(52,211,153,.16); color: #34D399; }
  .role-police { background: rgba(255,196,75,.18); color: #FFC24B; }
  .role-spy { background: rgba(180,180,190,.18); color: #C7CAD1; }
  .role-politician { background: rgba(255,140,90,.18); color: #FF9E6B; }
  .role-gay { background: rgba(255,120,200,.16); color: #FF8AD4; }
  .role-orator { background: rgba(120,220,255,.16); color: #6BD5FF; }
  .role-reporter { background: rgba(120,255,180,.16); color: #4FE0A0; }
  .rv-orator { background: rgba(120,220,255,.13); }
  .rv-spy { background: rgba(180,180,190,.14); }
  .rv-politician { background: rgba(255,140,90,.13); }
  .rv-gay { background: rgba(255,120,200,.13); }
  .spy-pick { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .spy-pick button { flex: 1; min-width: 90px; }
  .mf-cols { display: grid; grid-template-columns: 1fr 340px; gap: 14px; align-items: start; }
  @media (max-width: 760px) { .mf-cols { grid-template-columns: 1fr; } }
  /* 플레이어 */
  .mf-players { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
  .pl { position: relative; background: var(--panel); border: 1.5px solid var(--line); border-radius: 12px;
    padding: 12px 10px; text-align: center; }
  .pl.able { cursor: pointer; } .pl.able:hover { border-color: var(--accent); }
  .pl.picked { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
  .pl.dead { opacity: .5; }
  .pl__nick { font-weight: 700; font-size: 14px; word-break: break-all; }
  .pl__sub { font-size: 11.5px; color: var(--text-dim); margin-top: 3px; min-height: 14px; }
  .pl__votes { position: absolute; top: 6px; right: 8px; font-size: 12px; font-weight: 800; color: var(--accent); }
  .pl__x { position: absolute; top: 6px; left: 8px; font-size: 14px; }
  /* 패널 */
  .mf-panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 16px; margin-bottom: 14px; }
  .mf-hint { font-size: 13.5px; color: var(--text-dim); line-height: 1.55; }
  .mf-win { text-align: center; padding: 18px; border-radius: var(--radius-sm); font-weight: 800; font-size: 20px; margin-bottom: 14px; }
  .win-mafia { background: rgba(255,92,122,.16); color: #FF6B81; border: 1px solid #FF6B81; }
  .win-citizen { background: rgba(52,211,153,.16); color: #34D399; border: 1px solid #34D399; }
  .mf-invest { font-size: 13px; margin-top: 8px; }
  .mf-invest div { padding: 3px 0; }
  .mf-reveal { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .rv { padding: 8px 12px; border-radius: 10px; font-size: 14px; }
  .rv-mafia { background: rgba(255,92,122,.14); }
  .rv-doctor { background: rgba(52,211,153,.13); }
  .rv-police { background: rgba(255,196,75,.14); }
  .rv-citizen { background: rgba(120,160,255,.12); }
  /* 채팅 */
  .mf-chat { display: flex; flex-direction: column; height: 560px; background: var(--panel);
    border: 1px solid var(--line); border-radius: var(--radius-sm); overflow: hidden; }
  .mf-chat__head { padding: 10px 14px; border-bottom: 1px solid var(--line); font-weight: 800; font-size: 13.5px; }
  .mf-chat__body { flex: 1; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
  .msg { font-size: 13.5px; line-height: 1.45; word-break: break-word; }
  .msg__from { font-weight: 800; }
  .msg.sys { color: var(--text-dim); text-align: center; font-size: 12.5px; padding: 2px 0; }
  .msg.mafia .msg__from { color: #FF6B81; } .msg.mafia { color: #ffb3bf; }
  .msg.ghost .msg__from { color: #C79BFF; } .msg.ghost { color: #d9c2ff; }
  .msg.seduce .msg__from { color: #FF8AD4; } .msg.seduce { color: #ffc2e6; }
  .mf-chat__foot { display: flex; gap: 6px; padding: 10px; border-top: 1px solid var(--line); }
  .mf-chat__foot input { flex: 1; background: var(--bg); border: 1px solid var(--line); color: var(--text);
    border-radius: 8px; padding: 9px 11px; font: inherit; font-size: 14px; }
  .mf-chat__foot input:disabled { opacity: .5; }
  .mf-players-wrap h3 { font-size: 13px; color: var(--text-dim); font-weight: 700; margin: 0 0 8px; }
  /* 참여자 서랍 토글 (오른쪽 가장자리) */
  .mf-fab { position: fixed; right: 0; top: 46%; transform: translateY(-50%); z-index: 50;
    display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; font: inherit;
    background: var(--accent); color: #10131a; border: 0; border-radius: 16px 0 0 16px;
    padding: 14px 8px 14px 10px; box-shadow: -3px 3px 14px rgba(0,0,0,.4); }
  .mf-fab__arrow { font-size: 22px; font-weight: 900; line-height: 1; }
  .mf-fab__label { font-size: 11px; font-weight: 800; writing-mode: vertical-rl; letter-spacing: 2px; }
  .mf-fab__dot { position: absolute; top: -5px; left: -5px; width: 14px; height: 14px; border-radius: 50%; background: #FF5C7A; border: 2px solid var(--bg); }
  .mf-fab.act { animation: mfFab 1.3s ease-in-out infinite; }
  @keyframes mfFab { 0%,100% { box-shadow: -3px 3px 14px rgba(0,0,0,.4); } 50% { box-shadow: -3px 3px 14px rgba(0,0,0,.4), 0 0 0 7px rgba(255,92,122,.28); } }
  .mf-drawer__backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 60; }
  .mf-drawer { position: fixed; top: 0; right: 0; height: 100%; width: min(90vw, 380px); z-index: 61;
    background: var(--bg); border-left: 1px solid var(--line); box-shadow: -8px 0 28px rgba(0,0,0,.45);
    transform: translateX(100%); transition: transform .25s ease; display: flex; flex-direction: column; }
  .mf-drawer.is-open { transform: translateX(0); }
  .mf-drawer__head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); flex: 0 0 auto; }
  .mf-drawer__head h3 { margin: 0; font-size: 14px; font-weight: 800; flex: 1; color: var(--text); }
  .mf-drawer__close { background: var(--panel); border: 1px solid var(--line); color: var(--text); border-radius: 8px; width: 34px; height: 34px; font-size: 15px; cursor: pointer; flex: 0 0 auto; }
  .mf-drawer__hint { margin: 12px 16px 0; padding: 9px 12px; border-radius: 10px; font-size: 13px; font-weight: 700;
    background: rgba(255,196,75,.15); color: #FFC24B; border: 1px solid rgba(255,196,75,.35); }
  .mf-drawer .mf-players { padding: 14px 16px 24px; overflow-y: auto; }
  .mf-legend { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px 16px; }
  .mf-legend summary { cursor: pointer; font-weight: 800; font-size: 13.5px; }
  .mf-legend .lg { font-size: 13px; line-height: 1.5; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .mf-legend .lg:last-child { border-bottom: 0; }
  .mf-legend .lg b { font-weight: 800; }
  .mf-legend .lg .tm { font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 6px; margin-left: 4px; }
  .tm-maf { background: rgba(255,92,122,.18); color: #FF6B81; }
  .tm-cit { background: rgba(120,160,255,.16); color: #7FA8FF; }
  .tm-neu { background: rgba(180,180,190,.18); color: #C7CAD1; }
</style>

<header class="header"><div class="header__inner" data-header></div></header>

<main class="wrap page mf-wrap">
  <p class="page__eyebrow"><a href="game.html" style="color:inherit;text-decoration:none">🎮 게임</a> › 마피아</p>
  <h1 class="page__title">🕵️ 마피아</h1>

  <!-- 서버 필요 안내 -->
  <div data-noserver hidden class="empty" style="padding:30px"><strong>이 게임은 호랑봇 서버에서만 돌아가요</strong>horangbot.co.kr 에서 접속해주세요.</div>

  <!-- 셋업 -->
  <section data-setup hidden>
    <p class="page__desc">방을 만들어 코드를 공유하거나, 받은 코드로 참가하세요. 최소 4명 · 최대 15명.</p>
    <p class="mf-hint" data-create-note hidden style="margin:-4px 0 12px">💡 방 생성은 관리자만 할 수 있어요. 관리자가 만든 방 코드를 받아 참가해주세요.</p>
    <div class="mf-setup">
      <div class="mf-box" data-create-box>
        <h2>➕ 방 만들기</h2>
        <input class="mf-input" data-create-nick maxlength="16" placeholder="내 닉네임">
        <button class="btn btn--primary" data-create style="width:100%">방 만들기</button>
      </div>
      <div class="mf-box">
        <h2>🚪 방 참가</h2>
        <input class="mf-input" data-join-code maxlength="4" placeholder="방 코드 (4자리)" style="text-transform:uppercase">
        <input class="mf-input" data-join-nick maxlength="16" placeholder="내 닉네임">

  <!-- 게임 -->
  <section data-game hidden>
    <div class="mf-bar">
      <span class="mf-phase" data-phase>—</span>
      <span class="mf-code" data-code title="코드 복사"></span>
      <span class="mf-role" data-myrole hidden></span>
      <span class="mf-timer" data-timer></span>

    <div data-win hidden></div>

    <div class="mf-cols">
      <div>
        <div class="mf-panel" data-context></div>
      </div>
      <div class="mf-chat">
        <div class="mf-chat__head" data-chat-head>💬 채팅</div>
        <div class="mf-chat__body" data-chat-body></div>
        <div class="mf-chat__foot">
          <input data-chat-input maxlength="300" placeholder="메시지 입력…">
          <button class="btn btn--primary btn--sm" data-chat-send>전송</button>
        </div>
      </div>
    </div>

    <!-- 참여자 서랍 토글 (오른쪽 가장자리) -->
    <button class="mf-fab" data-players-toggle aria-label="참여자 목록 열기">
      <span class="mf-fab__dot" data-fab-dot hidden></span>
      <span class="mf-fab__arrow" data-fab-arrow>‹</span>
      <span class="mf-fab__label" data-fab-label>참여자</span>

    <div class="mf-drawer__backdrop" data-players-backdrop hidden></div>
    <aside class="mf-drawer" data-players-drawer>
      <div class="mf-drawer__head">
        <h3 data-players-label>참가자</h3>
        <button class="mf-drawer__close" data-players-close aria-label="닫기">✕</button>
      </div>
      <div class="mf-drawer__hint" data-drawer-hint hidden></div>
      <div class="mf-players" data-players></div>

    <details class="mf-legend" style="margin-top:14px">

      <div data-legend></div>

</main>

<script>
App.header("game.html");

const MAFIA_URL = ((window.CONFIG && CONFIG.SCRIPT_URL) === "/api/gs") ? "/api/mafia" : null;
const LS = "horang.mafia";
const $ = s => document.querySelector(s);
const esc = App.esc;
const ROLE = { mafia: ["🔪", "마피아", "role-mafia"], citizen: ["🙂", "시민", "role-citizen"],
  doctor: ["🩺", "의사", "role-doctor"], police: ["🔎", "경찰", "role-police"],
  spy: ["🕶️", "스파이", "role-spy"], politician: ["🏛️", "정치인", "role-politician"],
  gay: ["🌈", "게이", "role-gay"], orator: ["🎤", "연설가", "role-orator"], reporter: ["📰", "기자", "role-reporter"] };
const ROLE_LEGEND = [
  ["🔪", "마피아", "maf", "마피아", "밤에 함께 한 명을 지목해 제거해요. 낮엔 시민인 척! <b>마피아 수 ≥ 나머지</b>가 되면 승리."],
  ["🙂", "시민", "cit", "시민", "특별한 능력은 없지만, 토론·투표로 마피아를 찾아내면 승리해요."],
  ["🩺", "의사", "cit", "시민", "밤마다 한 명을 지목해 그날 밤 습격에서 <b>살려요</b> (자기 자신도 가능)."],
  ["🔎", "경찰", "cit", "시민", "밤마다 한 명을 <b>조사</b>해 마피아인지 아닌지 바로 확인해요."],
  ["🏛️", "정치인", "cit", "시민", "낮 투표에서 <b>표가 2개</b>로 계산돼요."],
  ["🎤", "연설가", "cit", "시민", "살아있으면 낮 시간이 <b>+10초</b>, 그 <b>첫 10초는 연설가만</b> 발언할 수 있어요."],
  ["🌈", "게이", "cit", "시민", "밤에 한 명 유혹. <b>마피아</b>를 유혹하면 그 밤 그 마피아의 행동·마피아채팅을 막고 둘만 대화해요. 대신 <b>다음 낮엔 게이가 발언 불가</b>(체력 소모)."],
  ["📰", "기자", "cit", "시민", "<b>3일차 밤</b>에 한 명을 취재해 <b>그 사람의 직업을 특종으로 전체 공개</b>해요! (기자 정체는 안 밝혀져요)"],
  ["🕶️", "스파이", "neu", "접선하기 나름", "밤마다 한 명 <b>접선</b>. 마피아면 마피아편+마피아 대화, 경찰·의사면 시민편+야간 대화. 한번 접선하면 고정!"],
];
(function fillLegend() {
  const el = document.querySelector("[data-legend]"); if (!el) return;
  el.innerHTML = ROLE_LEGEND.map(r => `<div class="lg">${r[0]} <b>${r[1]}</b> <span class="tm tm-${r[2]}">${r[3]}</span><br>${r[4]}</div>`).join("");
})();
function rolePreview(n) {   // 서버 배정 공식과 동일 (대기실 미리보기용)
  const mafia = n >= 12 ? 3 : 2, doctor = n >= 6 ? 1 : 0, police = n >= 6 ? 1 : 0, politician = n >= 8 ? 1 : 0, spy = n >= 9 ? 1 : 0, gay = n >= 10 ? 1 : 0, orator = n >= 11 ? 1 : 0, reporter = n >= 12 ? 1 : 0;
  return { mafia, doctor, police, politician, spy, gay, orator, reporter, citizen: Math.max(0, n - mafia - doctor - police - politician - spy - gay - orator - reporter) };
}

let sess = null, sinceId = 0, pollTimer = null, tickTimer = null, phaseDeadline = 0, S = null;
let polling = false;           // 동시 폴링 방지
const seenMsgs = new Set();    // 이미 그린 메시지 id (중복 렌더 방지)
try { sess = JSON.parse(localStorage.getItem(LS) || "null"); } catch (e) {}
function saveSess(s) { sess = s; try { localStorage.setItem(LS, JSON.stringify(s)); } catch (e) {} }
function clearSess() { sess = null; try { localStorage.removeItem(LS); } catch (e) {} }

async function api(op, extra) {
  const body = Object.assign({ op }, sess ? { code: sess.code, pid: sess.pid } : {}, extra || {});
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 8000);   // 8초 타임아웃 (요청 무한대기·쌓임 방지)
  try {
    const r = await fetch(MAFIA_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body), signal: ctrl.signal });
    return await r.json();
  } finally { clearTimeout(t); }
}
function show(which) {
  $("[data-noserver]").hidden = which !== "noserver";
  $("[data-setup]").hidden = which !== "setup";
  $("[data-game]").hidden = which !== "game";
}

/* ---------- 셋업 ---------- */
$("[data-create]").onclick = async () => {
  const nick = $("[data-create-nick]").value.trim();
  if (!nick) return App.toast("닉네임을 입력해주세요.");
  const j = await api("create", { nick, key: App.key() });
  if (!j.ok) return App.toast(j.error || "방 생성 실패");
  saveSess({ code: j.code, pid: j.pid }); sinceId = 0; startGame();
};
$("[data-join]").onclick = async () => {
  const code = $("[data-join-code]").value.trim().toUpperCase();
  const nick = $("[data-join-nick]").value.trim();
  if (!code || !nick) return App.toast("코드와 닉네임을 입력해주세요.");
  const j = await api("join", { code, nick });
  if (!j.ok) return App.toast(j.error || "참가 실패");
  saveSess({ code: j.code, pid: j.pid }); sinceId = 0; startGame();
};
$("[data-leave]").onclick = async () => {
  if (S && S.phase !== "lobby" && S.phase !== "ended" && !confirm("게임 도중 나가면 다시 못 들어와요. 나갈까요?")) return;
  try { if (sess) await api("leave"); } catch (e) {}
  clearSess(); stopPoll(); location.href = "game.html";
};

/* ---------- 폴링 ---------- */
function startGame() { show("game"); startPoll(); }
function startPoll() { stopPoll(); poll(); pollTimer = setInterval(poll, 1500); tickTimer = setInterval(tick, 250); }
function stopPoll() { clearInterval(pollTimer); clearInterval(tickTimer); pollTimer = tickTimer = null; }
async function poll() {
  if (polling) return;   // 이전 폴링이 아직 안 끝났으면 건너뜀 (타임아웃 8초로 무한대기 방지)
  polling = true;
  let j;
  try { j = await api("state", { since: sinceId }); }
  catch (e) { return; }
  finally { polling = false; }
  if (!j.ok) { if (j.gone) { clearSess(); stopPoll(); show("setup"); App.toast(j.error || "다시 입장해주세요."); } return; }
  S = j;
  if (j.msgs && j.msgs.length) appendMsgs(j.msgs);
  render(j);
}
function tick() {
  if (!phaseDeadline) { $("[data-timer]").textContent = ""; return; }
  const rem = Math.max(0, Math.ceil((phaseDeadline - Date.now()) / 1000));
  const m = Math.floor(rem / 60), s = rem % 60;
  $("[data-timer]").textContent = "⏳ " + (m ? m + ":" + String(s).padStart(2, "0") : s + "초");
}

/* ---------- 렌더 ---------- */
const PHASE_LABEL = { lobby: "🕗 대기실", night: "🌙 밤", day: "☀️ 낮 (토론·투표)", ended: "🏁 게임 종료" };
function render(j) {
  phaseDeadline = j.deadline ? Date.now() + (j.deadline - j.now) : 0;
  $("[data-phase]").textContent = (PHASE_LABEL[j.phase] || j.phase) + (j.day ? " · " + j.day + "일차" : "");
  const codeEl = $("[data-code]"); codeEl.textContent = j.code;
  codeEl.onclick = () => { navigator.clipboard && navigator.clipboard.writeText(j.code); App.toast("코드 복사됨: " + j.code); };

  const rEl = $("[data-myrole]");
  if (j.me.role) { const r = ROLE[j.me.role]; rEl.hidden = false; rEl.className = "mf-role " + r[2]; rEl.textContent = r[0] + " " + r[1]; }
  else rEl.hidden = true;

  // 승리 배너
  const winEl = $("[data-win]");
  if (j.phase === "ended" && j.winner) {
    winEl.hidden = false;
    winEl.className = "mf-win " + (j.winner === "mafia" ? "win-mafia" : "win-citizen");
    winEl.textContent = j.winner === "mafia" ? "🔪 마피아 승리!" : "🎉 시민 승리!";
  } else winEl.hidden = true;

  renderPlayers(j);
  renderContext(j);
  // 채팅 입력 가능 여부 / 채널 안내
  const myMafiaTeam = j.me.role === "mafia" || (j.me.role === "spy" && j.me.spyTeam === "mafia");
  const spyCh = j.me.role === "spy" ? j.me.spyContact : null;
  const night = j.phase === "night";
  const nightMafia = night && myMafiaTeam;
  const nightPolice = night && j.canChat && (j.me.role === "police" || spyCh === "police");
  const nightDoctor = night && j.canChat && (j.me.role === "doctor" || spyCh === "doctor");
  const inp = $("[data-chat-input]");
  inp.disabled = !j.canChat;
  inp.placeholder = j.canChat
    ? (j.me.sedChat ? "💘 유혹 대화 (둘만)…" : nightMafia ? "🔪 마피아 채팅…" : nightPolice ? "🔎 경찰팀 채팅…" : nightDoctor ? "🩺 의사팀 채팅…" : (j.speech ? "🎤 연설 중! 지금은 당신만 발언 가능…" : (!j.me.alive ? "👻 유령 채팅…" : "메시지 입력…")))
    : (j.me.exhausted && j.phase === "day" ? "😵 유혹 성공! 오늘은 체력 소모로 발언 불가…" : night ? "밤에는 대화할 수 없어요 (특수 역할만)" : j.speech ? "🎤 연설가가 발언 중이에요… 곧 말할 수 있어요" : "지금은 채팅할 수 없어요");
  $("[data-chat-head]").textContent = !j.me.alive ? "👻 유령 채팅 (관전)"
    : (j.me.exhausted && j.phase === "day") ? "😵 발언 불가 (체력 소모)"
    : j.me.sedChat ? "💘 유혹 대화 (둘만)"
    : nightMafia ? "🔪 마피아 채팅"
    : nightPolice ? "🔎 경찰팀 채팅"
    : nightDoctor ? "🩺 의사팀 채팅"
    : j.speech ? "🎤 연설 시간"
    : "💬 채팅";
}

function renderPlayers(j) {
  const wrap = $("[data-players]");
  const night = j.phase === "night", day = j.phase === "day";
  const canSeduce = j.me.role === "gay" && !j.seduced;
  const canReport = j.me.role === "reporter" && j.day === 3 && !j.me.reporterUsed;
  const iCanNight = night && j.me.alive && !j.me.blocked && (["mafia", "doctor", "police"].includes(j.me.role) || (j.me.role === "spy" && !j.me.spyContact) || canSeduce || canReport);
  const iCanVote = day && j.me.alive;
  let label = `참가자 ${j.players.filter(p => p.alive).length}/${j.players.length}명 생존`;
  if (j.counts) label += ` · 🔪 마피아 ${j.counts.mafia}명`;
  $("[data-players-label]").textContent = label;

  // 오른쪽 서랍 토글(FAB) 상태 — 투표/지목할 수 있을 땐 강조
  const canAct = iCanNight || iCanVote;
  const fab = $("[data-players-toggle]");
  fab.classList.toggle("act", canAct);
  $("[data-fab-dot]").hidden = !canAct;
  $("[data-fab-label]").textContent = iCanVote ? "투표하기" : iCanNight ? "지목하기" : "참여자";
  const hint = $("[data-drawer-hint]");
  if (iCanVote) { hint.hidden = false; hint.textContent = "🗳️ 처형할 사람을 눌러 투표하세요. (다시 누르면 취소)"; }
  else if (iCanNight) { hint.hidden = false; hint.textContent = "🌙 밤 대상을 눌러 선택하세요."; }
  else { hint.hidden = true; }

  wrap.innerHTML = j.players.map(p => {
    const roleTag = p.role ? `<span class="mf-role ${ROLE[p.role][2]}" style="font-size:10px;padding:1px 6px">${ROLE[p.role][0]}${ROLE[p.role][1]}</span>` : "";
    let sub = "";
    if (!p.alive) sub = "💀 사망";
    else if (j.me.role === "mafia" && night && p.role === "mafia") sub = roleTag;
    else if (p.role && (j.phase === "ended")) sub = roleTag;
    else if (p.host && j.phase === "lobby") sub = "👑 방장";
    // 표시용 선택 여부
    let picked = false, able = false;
    if (iCanNight && p.alive) {
      able = (j.me.role === "doctor") ? true : (p.pid !== j.me.pid);   // 의사만 자기자신 가능
      picked = j.myNightTarget === p.pid;
    } else if (iCanVote && p.alive) { able = true; picked = j.myVote === p.pid; }
    const votes = (day && j.voteCounts && j.voteCounts[p.pid]) ? `<span class="pl__votes">🗳️${j.voteCounts[p.pid]}</span>` : "";
    const mpick = (night && j.mafiaPicks) ? Object.values(j.mafiaPicks).filter(t => t === p.pid).length : 0;
    const mpickBadge = mpick ? `<span class="pl__votes">🔪${mpick}</span>` : "";
    return `<div class="pl ${p.alive ? "" : "dead"} ${able ? "able" : ""} ${picked ? "picked" : ""}" data-pid="${p.pid}">
      ${!p.alive ? '<span class="pl__x">💀</span>' : ""}${votes || mpickBadge}
      <div class="pl__nick">${esc(p.nick)}${p.role === "mafia" ? " <span style='color:#FF6B81;font-weight:800'>(마피아)</span>" : ""}${p.role === "spy" ? " <span style='color:#C7CAD1;font-weight:800'>(스파이)</span>" : ""}${p.isMe ? " <span style='color:var(--accent)'>(나)</span>" : ""}</div>
      <div class="pl__sub">${sub}</div>
    </div>`;
  }).join("");

  wrap.querySelectorAll(".pl.able").forEach(el => el.onclick = async () => {
    const pid = el.dataset.pid;
    if (night) { const r = await api("action", { target: pid }); if (!r.ok) App.toast(r.error); else { if (r.seduced) App.toast("유혹에 성공하였습니다 💘"); poll(); } }
    else if (day) {
      const same = j.myVote === pid;
      const r = await api("vote", { target: same ? null : pid });
      if (!r.ok) App.toast(r.error); else poll();
    }
  });
}

/* ---------- 채팅 ---------- */
function appendMsgs(msgs) {
  const body = $("[data-chat-body]");
  const atBottom = body.scrollHeight - body.scrollTop - body.clientHeight < 40;
  let added = 0;
  msgs.forEach(m => {
    if (seenMsgs.has(m.id)) return;   // 이미 그린 메시지면 건너뜀 (중복 방지)
    seenMsgs.add(m.id);
    if (m.id > sinceId) sinceId = m.id;
    const d = document.createElement("div");
    const cls = m.ch && m.ch.indexOf("sed_") === 0 ? "seduce" : (m.ch || "all");
    if (m.sys) { d.className = "msg sys" + (cls === "seduce" ? " seduce" : ""); d.textContent = m.text; }
    else { d.className = "msg " + cls; d.innerHTML = `<span class="msg__from">${esc(m.from)}</span> ${esc(m.text)}`; }
    body.appendChild(d); added++;
  });
  if (added && atBottom) body.scrollTop = body.scrollHeight;
}
async function sendChat() {
  const inp = $("[data-chat-input]");
  const text = inp.value.trim();
  if (!text) return;
  inp.value = "";
  const r = await api("chat", { text });
  if (!r.ok) App.toast(r.error); else poll();
}
$("[data-chat-send]").onclick = sendChat;
$("[data-chat-input]").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); sendChat(); } });

/* ---------- 참여자 서랍 ---------- */
function drawer(on) {
  const d = $("[data-players-drawer]"), bd = $("[data-players-backdrop]"), arw = $("[data-fab-arrow]");
  const open = on === undefined ? !d.classList.contains("is-open") : on;
  d.classList.toggle("is-open", open);
  bd.hidden = !open;
  arw.textContent = open ? "›" : "‹";
}
$("[data-players-toggle]").onclick = () => drawer();
$("[data-players-close]").onclick = () => drawer(false);
$("[data-players-backdrop]").onclick = () => drawer(false);

/* ---------- 시작 ---------- */
if (!App.isAdmin()) {   // 방 생성은 관리자만 — 비관리자는 생성 박스 숨기고 참가만
  const cb = $("[data-create-box]"), note = $("[data-create-note]");
  if (cb) cb.hidden = true;
  if (note) note.hidden = false;
  const setup = document.querySelector(".mf-setup");
  if (setup) setup.style.gridTemplateColumns = "1fr";
}
if (!MAFIA_URL) show("noserver");
else if (sess) startGame();
else show("setup");
window.addEventListener("beforeunload", stopPoll);
</script>
</body>
</html>
