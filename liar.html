<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png?v=20260831.75">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=20260831.75">
<meta property="og:type" content="website">
<meta property="og:title" content="라이어 게임 · 호랑봇 허브">
<meta property="og:description" content="제시어를 모르는 라이어를 찾아라! 웹에서 자동 진행 (최대 15명)">
<meta property="og:url" content="https://horangbot.co.kr/liar.html">
<meta property="og:image" content="https://horangbot.co.kr/assets/og-image.png">

<title>라이어 게임 · 호랑봇 허브</title>
<link rel="stylesheet" href="assets/style.css?v=20260831.75">
<style>
  .mf-wrap { max-width: 900px; }
  .mf-setup { display: grid; gap: 14px; grid-template-columns: 1fr 1fr; margin-top: 8px; }
  @media (max-width: 620px) { .mf-setup { grid-template-columns: 1fr; } }
  .mf-box { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 18px; }
  .mf-box h2 { font-size: 16px; font-weight: 800; margin: 0 0 12px; }
  .mf-input { width: 100%; box-sizing: border-box; background: var(--bg); border: 1px solid var(--line);
    color: var(--text); border-radius: 10px; padding: 11px 13px; font: inherit; font-size: 15px; margin-bottom: 10px; }
  .mf-input:focus { outline: none; border-color: var(--accent); }
  .mf-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--panel);
    border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px 16px; margin-bottom: 14px; }
  .mf-phase { font-size: 17px; font-weight: 800; }
  .mf-timer { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 800; font-size: 18px; color: var(--accent); }
  .mf-code { font-weight: 800; letter-spacing: 2px; background: var(--bg); border: 1px solid var(--line);
    border-radius: 8px; padding: 4px 10px; cursor: pointer; }
  .mf-role { font-weight: 800; padding: 3px 10px; border-radius: 999px; font-size: 13px; }
  .role-liar { background: rgba(255,92,122,.18); color: #FF6B81; }
  .role-citizen { background: rgba(120,160,255,.16); color: #7FA8FF; }
  .mf-cols { display: grid; grid-template-columns: 1fr 340px; gap: 14px; align-items: start; }
  @media (max-width: 760px) { .mf-cols { grid-template-columns: 1fr; } }
  .mf-players { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
  .pl { position: relative; background: var(--panel); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 10px; text-align: center; }
  .pl.able { cursor: pointer; } .pl.able:hover { border-color: var(--accent); }
  .pl.picked { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
  .pl.turn { border-color: #FFC24B; box-shadow: 0 0 0 2px #FFC24B inset; }
  .pl__nick { font-weight: 700; font-size: 14px; word-break: break-all; }
  .pl__sub { font-size: 11.5px; color: var(--text-dim); margin-top: 3px; min-height: 14px; }
  .pl__votes { position: absolute; top: 6px; right: 8px; font-size: 12px; font-weight: 800; color: var(--accent); }
  .mf-panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 16px; margin-bottom: 14px; }
  .mf-hint { font-size: 13.5px; color: var(--text-dim); line-height: 1.55; }
  .word-box { text-align: center; padding: 14px; border-radius: 12px; margin-bottom: 12px; font-weight: 800; }
  .word-citizen { background: rgba(120,160,255,.14); border: 1px solid rgba(120,160,255,.4); }
  .word-liar { background: rgba(255,92,122,.14); border: 1px solid rgba(255,92,122,.4); }
  .word-box .big { font-size: 24px; display: block; margin-top: 4px; }
  .word-box .cat { font-size: 12.5px; color: var(--text-dim); font-weight: 600; }
  .hints-list { margin-top: 10px; display: flex; flex-direction: column; gap: 5px; }
  .hint-item { font-size: 13.5px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  .hint-item b { font-weight: 800; }
  .mf-win { text-align: center; padding: 18px; border-radius: var(--radius-sm); font-weight: 800; font-size: 20px; margin-bottom: 14px; }
  .win-liar { background: rgba(255,92,122,.16); color: #FF6B81; border: 1px solid #FF6B81; }
  .win-citizen { background: rgba(52,211,153,.16); color: #34D399; border: 1px solid #34D399; }
  .guess-row { display: flex; gap: 8px; margin-top: 10px; }
  .guess-row input { flex: 1; background: var(--bg); border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 10px 12px; font: inherit; }
  .mf-chat { display: flex; flex-direction: column; height: 560px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-sm); overflow: hidden; }
  .mf-chat__head { padding: 10px 14px; border-bottom: 1px solid var(--line); font-weight: 800; font-size: 13.5px; }
  .mf-chat__body { flex: 1; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
  .msg { font-size: 13.5px; line-height: 1.45; word-break: break-word; }
  .msg__from { font-weight: 800; }
  .msg.sys { color: var(--text-dim); text-align: center; font-size: 12.5px; padding: 2px 0; }
  .mf-chat__foot { display: flex; gap: 6px; padding: 10px; border-top: 1px solid var(--line); }
  .mf-chat__foot input { flex: 1; background: var(--bg); border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 9px 11px; font: inherit; font-size: 14px; }
  .mf-chat__foot input:disabled { opacity: .5; }
  .mf-players-wrap h3 { font-size: 13px; color: var(--text-dim); font-weight: 700; margin: 0 0 8px; }
</style>
</head>
<body>

<header class="header"><div class="header__inner" data-header></div></header>

<main class="wrap page mf-wrap">
  <p class="page__eyebrow"><a href="game.html" style="color:inherit;text-decoration:none">🎮 게임</a> › 라이어 게임</p>
  <h1 class="page__title">🃏 라이어 게임</h1>

  <div data-noserver hidden class="empty" style="padding:30px"><strong>이 게임은 호랑봇 서버에서만 돌아가요</strong>horangbot.co.kr 에서 접속해주세요.</div>

  <section data-setup hidden>
    <p class="page__desc">제시어를 모르는 <b>라이어</b> 한 명을 찾아내는 게임! 힌트를 듣고 라이어를 지목하세요. 최소 3명 · 최대 15명.</p>
    <p class="mf-hint" data-create-note hidden style="margin:-4px 0 12px">💡 방 생성은 관리자만 할 수 있어요. 관리자가 만든 방 코드를 받아 참가해주세요.</p>
    <div class="mf-setup">
      <div class="mf-box" data-create-box>
        <h2>➕ 방 만들기</h2>
        <input class="mf-input" data-create-nick maxlength="16" placeholder="내 닉네임">
        <button class="btn btn--primary" data-create style="width:100%">방 만들기</button>
      </div>
      <div class="mf-box">
        <h2>🚪 방 참가</h2>
        <input class="mf-input" data-join-code maxlength="4" placeholder="방 코드 (4자리)" style="text-transform:uppercase">
        <input class="mf-input" data-join-nick maxlength="16" placeholder="내 닉네임">
        <button class="btn btn--primary" data-join style="width:100%">참가하기</button>
      </div>
    </div>
  </section>

  <section data-game hidden>
    <div class="mf-bar">
      <span class="mf-phase" data-phase>—</span>
      <span class="mf-code" data-code title="코드 복사"></span>
      <span class="mf-role" data-myrole hidden></span>
      <span class="mf-timer" data-timer></span>
    </div>

    <div data-win hidden></div>

    <div class="mf-cols">
      <div>
        <div data-wordbox></div>
        <div class="mf-panel" data-context></div>
        <div class="mf-players-wrap">
          <h3 data-players-label>참가자</h3>
          <div class="mf-players" data-players></div>
        </div>
      </div>
      <div class="mf-chat">
        <div class="mf-chat__head" data-chat-head>💬 채팅</div>
        <div class="mf-chat__body" data-chat-body></div>
        <div class="mf-chat__foot">
          <input data-chat-input maxlength="300" placeholder="메시지 입력…">
          <button class="btn btn--primary btn--sm" data-chat-send>전송</button>
        </div>
      </div>
    </div>

    <div style="margin-top:14px"><button class="btn btn--ghost btn--sm" data-leave>나가기</button></div>
  </section>
</main>

<script src="assets/config.js?v=20260831.75"></script>
<script src="assets/store.js?v=20260831.75"></script>
<script src="assets/app.js?v=20260831.75"></script>
<script>
App.header("game.html");

const LIAR_URL = ((window.CONFIG && CONFIG.SCRIPT_URL) === "/api/gs") ? "/api/liar" : null;
const LS = "horang.liar";
const $ = s => document.querySelector(s);
const esc = App.esc;

let sess = null, sinceId = 0, pollTimer = null, tickTimer = null, phaseDeadline = 0, S = null, polling = false;
const seenMsgs = new Set();
try { sess = JSON.parse(localStorage.getItem(LS) || "null"); } catch (e) {}
function saveSess(s) { sess = s; try { localStorage.setItem(LS, JSON.stringify(s)); } catch (e) {} }
function clearSess() { sess = null; try { localStorage.removeItem(LS); } catch (e) {} }

async function api(op, extra) {
  const body = Object.assign({ op }, sess ? { code: sess.code, pid: sess.pid } : {}, extra || {});
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 8000);
  try {
    const r = await fetch(LIAR_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body), signal: ctrl.signal });
    return await r.json();
  } finally { clearTimeout(t); }
}
function show(which) {
  $("[data-noserver]").hidden = which !== "noserver";
  $("[data-setup]").hidden = which !== "setup";
  $("[data-game]").hidden = which !== "game";
}

$("[data-create]").onclick = async () => {
  const nick = $("[data-create-nick]").value.trim();
  if (!nick) return App.toast("닉네임을 입력해주세요.");
  const j = await api("create", { nick, key: App.key() });
  if (!j.ok) return App.toast(j.error || "방 생성 실패");
  saveSess({ code: j.code, pid: j.pid }); sinceId = 0; startGame();
};
$("[data-join]").onclick = async () => {
  const code = $("[data-join-code]").value.trim().toUpperCase();
  const nick = $("[data-join-nick]").value.trim();
  if (!code || !nick) return App.toast("코드와 닉네임을 입력해주세요.");
  const j = await api("join", { code, nick });
  if (!j.ok) return App.toast(j.error || "참가 실패");
  saveSess({ code: j.code, pid: j.pid }); sinceId = 0; startGame();
};
$("[data-leave]").onclick = async () => {
  if (S && S.phase !== "lobby" && S.phase !== "ended" && !confirm("게임 도중 나가면 다시 못 들어와요. 나갈까요?")) return;
  try { if (sess) await api("leave"); } catch (e) {}
  clearSess(); stopPoll(); location.href = "game.html";
};

function startGame() { show("game"); startPoll(); }
function startPoll() { stopPoll(); poll(); pollTimer = setInterval(poll, 1500); tickTimer = setInterval(tick, 250); }
function stopPoll() { clearInterval(pollTimer); clearInterval(tickTimer); pollTimer = tickTimer = null; }
async function poll() {
  if (polling) return; polling = true;
  let j; try { j = await api("state", { since: sinceId }); } catch (e) { return; } finally { polling = false; }
  if (!j.ok) { if (j.gone) { clearSess(); stopPoll(); show("setup"); App.toast(j.error || "다시 입장해주세요."); } return; }
  S = j;
  if (j.msgs && j.msgs.length) appendMsgs(j.msgs);
  render(j);
}
function tick() {
  if (!phaseDeadline) { $("[data-timer]").textContent = ""; return; }
  const rem = Math.max(0, Math.ceil((phaseDeadline - Date.now()) / 1000));
  const m = Math.floor(rem / 60), s = rem % 60;
  $("[data-timer]").textContent = "⏳ " + (m ? m + ":" + String(s).padStart(2, "0") : s + "초");
}

const PHASE_LABEL = { lobby: "🕗 대기실", hint: "🗣️ 힌트", vote: "🗳️ 토론·투표", guess: "🎯 라이어 찬스", ended: "🏁 게임 종료" };
function render(j) {
  phaseDeadline = j.deadline ? Date.now() + (j.deadline - j.now) : 0;
  $("[data-phase]").textContent = (PHASE_LABEL[j.phase] || j.phase) + (j.phase === "hint" && j.round ? ` · ${j.round}/${j.maxRounds}라운드` : "");
  const codeEl = $("[data-code]"); codeEl.textContent = j.code;
  codeEl.onclick = () => { navigator.clipboard && navigator.clipboard.writeText(j.code); App.toast("코드 복사됨: " + j.code); };

  const rEl = $("[data-myrole]");
  if (j.me.role) { const liar = j.me.role === "liar"; rEl.hidden = false; rEl.className = "mf-role " + (liar ? "role-liar" : "role-citizen"); rEl.textContent = liar ? "🃏 라이어" : "🙂 시민"; }
  else rEl.hidden = true;

  // 제시어 박스
  const wb = $("[data-wordbox]");
  if (j.phase !== "lobby" && j.me.role) {
    if (j.me.role === "liar") wb.innerHTML = `<div class="word-box word-liar">🃏 당신은 <b>라이어</b>! 제시어를 몰라요.<span class="cat">카테고리: ${esc(j.category)}</span></div>`;
    else wb.innerHTML = `<div class="word-box word-citizen"><span class="cat">카테고리: ${esc(j.category)}</span><span class="big">${esc(j.me.word || "")}</span></div>`;
  } else wb.innerHTML = "";

  // 승리 배너
  const winEl = $("[data-win]");
  if (j.phase === "ended" && j.winner) {
    winEl.hidden = false;
    winEl.className = "mf-win " + (j.winner === "liar" ? "win-liar" : "win-citizen");
    winEl.textContent = j.winner === "liar" ? "🃏 라이어 승리!" : "🎉 시민 승리!";
  } else winEl.hidden = true;

  renderPlayers(j);
  renderContext(j);

  const inp = $("[data-chat-input]");
  inp.disabled = !j.canChat;
  if (j.phase === "hint") {
    inp.placeholder = j.turn && j.turn.isMe ? "💡 힌트를 입력하고 전송…" : (j.turn ? `${j.turn.nick}님 차례를 기다려요…` : "…");
  } else inp.placeholder = j.canChat ? "메시지 입력…" : "지금은 채팅할 수 없어요";
  $("[data-chat-head]").textContent = j.phase === "hint" ? "🗣️ 힌트 (차례인 사람만)" : "💬 채팅";
}

function renderPlayers(j) {
  const wrap = $("[data-players]");
  const vote = j.phase === "vote";
  $("[data-players-label]").textContent = `참가자 ${j.players.length}명`;
  wrap.innerHTML = j.players.map(p => {
    let sub = "";
    if (j.reveal && p.role === "liar") sub = "🃏 라이어";
    else if (p.host && j.phase === "lobby") sub = "👑 방장";
    const able = vote && !p.isMe;
    const picked = j.myVote === p.pid;
    const isTurn = j.turn && j.turn.pid === p.pid;
    const votes = (vote && j.voteCounts && j.voteCounts[p.pid]) ? `<span class="pl__votes">🗳️${j.voteCounts[p.pid]}</span>` : "";
    return `<div class="pl ${able ? "able" : ""} ${picked ? "picked" : ""} ${isTurn ? "turn" : ""}" data-pid="${p.pid}">
      ${votes}
      <div class="pl__nick">${isTurn ? "🗣️ " : ""}${esc(p.nick)}${p.isMe ? " <span style='color:var(--accent)'>(나)</span>" : ""}</div>
      <div class="pl__sub">${sub}</div>
    </div>`;
  }).join("");
  wrap.querySelectorAll(".pl.able").forEach(el => el.onclick = async () => {
    const same = j.myVote === el.dataset.pid;
    const r = await api("vote", { target: same ? null : el.dataset.pid });
    if (!r.ok) App.toast(r.error); else poll();
  });
}

function renderContext(j) {
  const el = $("[data-context]");
  const hintsHtml = (j.hints && j.hints.length)
    ? `<div class="hints-list">${j.hints.map(h => `<div class="hint-item"><b>${esc(h.nick)}</b> — ${esc(h.text)}</div>`).join("")}</div>` : "";

  if (j.phase === "lobby") {
    const n = j.players.length, canStart = j.isHost && n >= 3;
    el.innerHTML = `<div style="font-weight:800;font-size:16px;margin-bottom:6px">대기실 · ${n}명</div>
      <p class="mf-hint">코드 <b>${j.code}</b> 를 친구들에게 공유하세요. 최소 3명 · 최대 15명.<br>라이어 1명 빼고 모두 <b>방장이 정한 제시어</b>를 받아요.</p>
      ${j.isHost ? `
        <input class="ok-input" data-word maxlength="30" placeholder="이번 판 제시어 (예: 치킨) — 필수" style="margin-top:10px">
        <input class="ok-input" data-cat maxlength="20" placeholder="카테고리 (예: 음식) — 선택">
        <button class="btn btn--primary" data-start ${canStart ? "" : "disabled"} style="width:100%">${canStart ? "게임 시작 🎬" : `시작하려면 ${3 - n}명 더 필요`}</button>
        <p class="mf-hint" style="font-size:12px;margin-top:6px">※ 제시어는 방장만 보여요. 라이어는 카테고리만(있으면) 알게 돼요.</p>`
        : `<p class="mf-hint" style="margin-top:10px">👑 방장이 제시어를 정하고 시작하기를 기다리는 중…</p>`}`;
    const sb = el.querySelector("[data-start]");
    if (sb) sb.onclick = async () => {
      const word = (el.querySelector("[data-word]").value || "").trim();
      const category = (el.querySelector("[data-cat]").value || "").trim();
      if (!word) return App.toast("이번 판 제시어를 입력해주세요.");
      const r = await api("start", { word, category }); if (!r.ok) App.toast(r.error); else poll();
    };
    return;
  }
  if (j.phase === "hint") {
    el.innerHTML = `<div style="font-weight:800;margin-bottom:4px">🗣️ 힌트 단계 (${j.round}/${j.maxRounds}라운드)</div>
      <p class="mf-hint">${j.turn && j.turn.isMe ? "<b style='color:var(--accent)'>당신 차례예요!</b> 아래 채팅으로 제시어에 대한 힌트를 한 마디 보내세요. (라이어는 들키지 않게!)" : `지금은 <b>${esc(j.turn ? j.turn.nick : "")}</b>님 차례예요. 힌트를 잘 들어보세요.`}</p>${hintsHtml}`;
    return;
  }
  if (j.phase === "vote") {
    el.innerHTML = `<div style="font-weight:800;margin-bottom:4px">🗳️ 토론 & 투표</div>
      <p class="mf-hint">자유롭게 토론하고, 라이어라고 생각하는 사람을 눌러 투표하세요. (다시 누르면 취소) 시간이 끝나면 최다 득표자를 지목해요.</p>${hintsHtml}`;
    return;
  }
  if (j.phase === "guess") {
    if (j.me.role === "liar") {
      el.innerHTML = `<div style="font-weight:800;margin-bottom:4px">🎯 라이어 찬스!</div>
        <p class="mf-hint">들켰지만 기회가 있어요! <b>제시어를 맞히면 라이어 승리</b>예요. (카테고리: ${esc(j.category)})</p>
        <div class="guess-row"><input data-guess maxlength="30" placeholder="제시어 입력"><button class="btn btn--primary" data-guess-btn>제출</button></div>`;
      const gi = el.querySelector("[data-guess]"), gb = el.querySelector("[data-guess-btn]");
      const submit = async () => { const t = gi.value.trim(); if (!t) return; gb.disabled = true; const r = await api("guess", { text: t }); if (!r.ok) { gb.disabled = false; App.toast(r.error); } else poll(); };
      gb.onclick = submit; gi.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
    } else {
      el.innerHTML = `<div style="font-weight:800;margin-bottom:4px">🎯 라이어 찬스</div><p class="mf-hint">라이어가 제시어를 맞히는 중이에요… 맞히면 라이어 승, 틀리면 시민 승!</p>${hintsHtml}`;
    }
    return;
  }
  if (j.phase === "ended") {
    let g = "";
    if (j.guess) g = `<p class="mf-hint" style="margin-top:8px">라이어의 답: <b>${esc(j.guess.text)}</b> → ${j.guess.correct ? "✅ 정답!" : "❌ 오답"}</p>`;
    const rev = j.reveal ? `<div class="word-box word-citizen" style="margin-top:10px">제시어 <span class="big">${esc(j.reveal.word)}</span><span class="cat">라이어: ${esc(j.reveal.liar)}</span></div>` : "";
    if (j.isHost) {
      el.innerHTML = `<p class="mf-hint">게임 끝!</p>${rev}${g}
        <button class="btn btn--primary" data-again style="margin-top:12px">🔄 새 게임 (같은 방)</button>
        <button class="btn btn--ghost btn--sm" data-newroom style="margin-top:12px;margin-left:8px">새 방 만들기</button>`;
      el.querySelector("[data-again]").onclick = async () => { const r = await api("restart"); if (!r.ok) App.toast(r.error); else poll(); };
      el.querySelector("[data-newroom]").onclick = () => { clearSess(); stopPoll(); location.reload(); };
    } else {
      el.innerHTML = `<p class="mf-hint">게임 끝!</p>${rev}${g}<p class="mf-hint" style="margin-top:10px">👑 방장이 새 게임을 시작하면 자동으로 대기실로 이동해요.</p>`;
    }
    return;
  }
  el.innerHTML = "";
}

function appendMsgs(msgs) {
  const body = $("[data-chat-body]");
  const atBottom = body.scrollHeight - body.scrollTop - body.clientHeight < 40;
  let added = 0;
  msgs.forEach(m => {
    if (seenMsgs.has(m.id)) return;
    seenMsgs.add(m.id); if (m.id > sinceId) sinceId = m.id;
    const d = document.createElement("div");
    if (m.sys) { d.className = "msg sys"; d.textContent = m.text; }
    else { d.className = "msg"; d.innerHTML = `<span class="msg__from">${esc(m.from)}</span> ${esc(m.text)}`; }
    body.appendChild(d); added++;
  });
  if (added && atBottom) body.scrollTop = body.scrollHeight;
}
async function sendChat() {
  const inp = $("[data-chat-input]");
  const text = inp.value.trim();
  if (!text) return;
  inp.value = "";
  const r = await api("chat", { text });
  if (!r.ok) App.toast(r.error); else poll();
}
$("[data-chat-send]").onclick = sendChat;
$("[data-chat-input]").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); sendChat(); } });

if (!App.isAdmin()) {
  const cb = $("[data-create-box]"), note = $("[data-create-note]");
  if (cb) cb.hidden = true;
  if (note) note.hidden = false;
  const setup = document.querySelector(".mf-setup");
  if (setup) setup.style.gridTemplateColumns = "1fr";
}
if (!LIAR_URL) show("noserver");
else if (sess) startGame();
else show("setup");
window.addEventListener("beforeunload", stopPoll);
</script>
</body>
</html>
