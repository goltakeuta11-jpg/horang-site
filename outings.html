<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta property="og:type" content="website">
<meta property="og:title" content="호랑봇 안내소">
<meta property="og:description" content="봇 명령어 · 자소서 · 외출 · 패치노트를 한 곳에서.">
<meta name="theme-color" content="#12141B">
<script src="assets/inapp.js?v=20260831.13"></script>
<title>외출 · 호랑봇 안내소</title>
<link rel="stylesheet" href="assets/style.css?v=20260831.13">
<style>
  /* 외출 카드: 신청서 내용이 넓게 보이도록 1열 (좁은 화면에서 짓눌리던 문제 해결) */
  .outings-list { display: grid; grid-template-columns: 1fr; gap: 14px; max-width: 640px; }
  .outing__title { font-weight: 800; font-size: 15px; letter-spacing: -0.01em; margin-bottom: 10px; }
  .outing__title + .rows { margin-top: 2px; }
</style>
</head>
<body>

<header class="header"><div class="header__inner" data-header></div></header>

<main class="wrap page">
  <h1 class="page__title">외출 목록</h1>
  <p class="page__desc">방에서 외출한 사람 목록</p>

  <div class="toolbar">
    <input class="input" style="max-width:260px" placeholder="닉네임 검색" data-search>
    <span class="toolbar__spacer"></span>
    <span data-admin-tools></span>
  </div>

  <div class="outings-list" data-list></div>
</main>

<!-- 외출 입력 창 -->
<div class="modal" data-modal>
  <div class="modal__box">
    <h2 class="modal__title" data-modal-title>외출 추가</h2>
    <div data-form></div>
    <div class="modal__foot">
      <button class="btn btn--ghost" data-cancel>취소</button>
      <button class="btn btn--primary" data-save>저장</button>
    </div>
  </div>
</div>

<script src="assets/config.js?v=20260831.13"></script>
<script src="assets/store.js?v=20260831.13"></script>
<script src="assets/app.js?v=20260831.13"></script>
<script>
App.header("outings.html");

const admin = App.isAdmin();
const readOnly = !Store.canWrite;      // 읽기전용(CSV) 시트 모드면 아무도 못 씀
const canWrite = admin && !readOnly;   // ★ 외출은 등록·수정·삭제 모두 운영자만
const listEl = document.querySelector("[data-list]");
const modal = document.querySelector("[data-modal]");
let editIndex = -1;

/* 외출 양식 — 칸 하나에 여러 줄. "이름 : / 사유 : / 기한 :" 형식으로 쓰면 자동으로 예쁘게 정리됨 */
const FORM = [
  { k: "body", label: "내용", type: "area",
    ph: "이름 : \n사유 : \n기한 : " }
];

/* 관리자 도구 */
const tools = document.querySelector("[data-admin-tools]");
if (admin) {
  if (readOnly) {
    tools.innerHTML = `<a class="btn btn--primary" target="_blank" rel="noopener" href="${Store.sheetEditUrl()}">시트에서 수정하기</a>`;
  } else {
    tools.innerHTML = `<button class="btn btn--primary" data-add>외출 추가</button>`;
    tools.querySelector("[data-add]").onclick = () => open(-1);
  }
}

/* 내용을 "라벨 : 값" 줄로 예쁘게 정리.
   - 줄바꿈이 없으면 "이름 :", "사유 :" 같은 라벨 앞에 줄바꿈을 넣어 자동 정렬
   - 각 줄은 라벨/값 2열(row)로, 콜론 없는 첫 줄은 제목으로 */
function fmtOuting(text) {
  let t = String(text == null ? "" : text).trim();
  if (!t) return "";
  if (t.indexOf("\n") < 0) t = t.replace(/\s*([가-힣A-Za-z][가-힣A-Za-z0-9]{0,9})\s*:\s*/g, "\n$1: ");
  // "공지방(도) 외출하는지?" 질문형만 "공지방 외출 :" 라벨로 (하는지/여부 필수 → 다른 공지방 문장은 안 건드림)
  t = t.replace(/공지방\S*\s*외출\s*(?:하는지|여부)\s*[?:]?\s*/g, "\n공지방 외출: ");
  // "공지방도 외출 해야만 하는 타당한 이유는?" → "해야만 하는 타당한 이유 :" 라벨로
  t = t.replace(/공지방\S*\s*외출\s*(해야만[가-힣\s]*?이유)\s*(?:는|을)?\s*[?:]?\s*/g, "\n$1: ");
  const lines = t.split("\n").map(s => s.trim()).filter(Boolean);
  const body = lines.map((line, idx) => {
    const m = line.match(/^([가-힣A-Za-z][가-힣A-Za-z0-9 ]{0,15}?)\s*:\s*(.*)$/);
    if (m) return `<div class="row"><span class="row__k">${App.esc(m[1])}</span><span class="row__v">${App.esc(m[2])}</span></div>`;  // 값 없어도 라벨행으로(통일)
    if (idx === 0 && lines.length > 1) return `<div class="outing__title">${App.esc(line)}</div>`;
    return `<div class="row"><span class="row__v" style="grid-column:1/-1">${App.esc(line)}</span></div>`;
  }).join("");
  return `<div class="rows">${body}</div>`;
}

function card(o, i) {
  return `
    <article class="card member">
      ${fmtOuting(o.body)}
      ${canWrite ? `<div class="member__tools">
        <button class="btn btn--sm btn--ghost" data-edit="${i}">수정</button>
        <button class="btn btn--sm btn--danger" data-del="${i}">삭제</button>
      </div>` : ""}
    </article>`;
}

function render() {
  const q = (document.querySelector("[data-search]").value || "").toLowerCase().trim();
  const list = Store.get().outings
    .map((o, i) => ({ o, i }))
    .filter(({ o }) => !q || String(o.body || "").toLowerCase().includes(q))
    .sort((a, b) => b.i - a.i);  // 최근에 올린 게 위로

  if (!list.length) {
    listEl.innerHTML = `<div class="empty" style="grid-column:1/-1">
      <strong>외출한 사람이 없습니다</strong>${canWrite ? "‘외출 추가’로 닉네임을 올려보세요." : "운영자가 등록하면 여기에 나타납니다."}</div>`;
    return;
  }

  listEl.innerHTML = list.map(({ o, i }) => card(o, i)).join("");

  if (canWrite) {
    listEl.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => open(+b.dataset.edit));
    listEl.querySelectorAll("[data-del]").forEach(b => b.onclick = () => remove(+b.dataset.del));
  }
}

function open(i) {
  editIndex = i;
  const o = i < 0 ? {} : Store.get().outings[i];
  document.querySelector("[data-modal-title]").textContent = i < 0 ? "외출 추가" : "외출 수정";
  document.querySelector("[data-form]").innerHTML = FORM.map(f => `
    <label class="field"><span class="field__label">${f.label}</span>
      ${f.type === "area"
        ? `<textarea class="textarea" data-k="${f.k}" placeholder="${f.ph || ""}">${App.esc(o[f.k] || "")}</textarea>`
        : `<input class="input" data-k="${f.k}" placeholder="${f.ph || ""}" value="${App.esc(o[f.k] || "")}">`}
    </label>`).join("");
  modal.classList.add("is-on");
  modal.querySelector("[data-k]").focus();
}

function close() { modal.classList.remove("is-on"); }
document.querySelector("[data-cancel]").onclick = close;
modal.onclick = e => { if (e.target === modal) close(); };

document.querySelector("[data-save]").onclick = () => {
  const item = {};
  modal.querySelectorAll("[data-k]").forEach(el => item[el.dataset.k] = el.value.trim());
  if (!item.body) return App.toast("닉네임을 적어주세요.", true);
  const data = Store.get();
  if (editIndex < 0) data.outings.push(item); else data.outings[editIndex] = item;
  if (!Store.set(data)) return;   // 저장 차단(로드 전)이면 성공처리·화면갱신 안 함
  close(); render();
  App.toast(editIndex < 0 ? "등록했습니다." : "수정했습니다.");
};

function remove(i) {
  const data = Store.get();
  if (!confirm("이 사람을 목록에서 삭제할까요?")) return;
  data.outings.splice(i, 1);
  if (!Store.set(data)) return;   // 저장 차단(로드 전)이면 성공처리·화면갱신 안 함
  render();
  App.toast("삭제했습니다.");
}

document.querySelector("[data-search]").oninput = render;

/* 서버 모드면 데이터를 받아온 뒤 그립니다. 아니면 즉시 그립니다. */
Store.load()
  .then(render)
  .catch(e => { render(); App.toast(e.message, true); });
</script>
</body>
</html>
